        function updateOrganization(orgKey, values) {
            if (!canEdit) return;
            const nextCode = String(values['組織コード'] || '').trim();
            const nextName = String(values['組織名'] || '').trim();
            if (!nextName) return alert(t('error.orgNameRequired'));
            const rows = fullData.filter(row => getOrgGroup(row).key === orgKey);
            const existingOrg = getOrgOptions().find(item => item.key === orgKey);
            if (!existingOrg) return;
            const beforeRows = rows.map(row => cloneForLog(row));
            const beforeOrg = rows.length ? getOrgGroup(rows[0]) : existingOrg;
            const afterOrg = {
                key: orgKeyFromParts(nextCode, nextName),
                code: nextCode,
                name: nextName,
                label: nextCode ? `${nextCode} ${nextName}` : nextName,
                isUnset: false
            };
            rows.forEach((row, index) => {
                const beforeRow = cloneForLog(row);
                row['組織コード'] = nextCode;
                row['組織名'] = nextName;
                moveTagsForRow(beforeRow, row);
            });
            if (envGroupStore.records[orgKey]) {
                const record = envGroupStore.records[orgKey];
                delete envGroupStore.records[orgKey];
                record.key = afterOrg.key;
                record.code = afterOrg.code;
                record.name = afterOrg.name;
                record.groups = uniqueTags([DEFAULT_ENV_GROUP].concat((record.groups || []).map(normalizeGroupName)));
                envGroupStore.records[afterOrg.key] = record;
            } else {
                ensureEnvGroupRecord(afterOrg);
            }
            rdpData.forEach(remote => {
                if ((remote['組織名'] || '').trim() === beforeOrg.name) {
                    remote['組織名'] = nextName;
                }
            });
            resetPortalDerivedCaches();
            const summary = {
                action: 'edit-org',
                level: 'org',
                before: { org: beforeOrg, rows: beforeRows },
                after: { org: afterOrg, rows: rows.map(row => cloneForLog(row)) },
            };
            closeAddModal();
            savePortalFiles(summary)
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    initDropdown();
                    renderOrgFilterMenu();
                    document.getElementById('orgSelect').value = afterOrg.key;
                    syncProductionNavLink();
                    renderEnvironments(afterOrg.key);
                    renderTagFilters();
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function openGroupAdd(orgKey, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!canEdit) return;
            openAddModal('group', 'modal.groupAdd', [
                ['環境グループ', '', true, 'group-input'],
            ], { orgKey });
        }

        function addGroupToOrg(orgKey, values) {
            if (!canEdit) return;
            const org = getOrgOptions().find(item => item.key === orgKey);
            if (!org) return;
            const groupName = String(values['環境グループ'] || '').trim();
            if (!groupName) return alert(t('error.groupRequired'));
            const normalizedGroup = addGroupNameToOrg(orgKey, groupName);
            resetPortalDerivedCaches();
            closeAddModal();
            savePortalFiles({
                action: 'add-group',
                level: 'group',
                org,
                after: { group: normalizedGroup, rows: [] },
            })
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    renderEnvironments(org.key);
                    renderTagFilters();
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function openGroupEdit(orgKey, groupValue, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!canEdit) return;
            if (normalizeGroupName(groupValue) === DEFAULT_ENV_GROUP) return alert(t('error.defaultGroupProtected'));
            openAddModal('edit-group', 'modal.groupEdit', [
                ['環境グループ', normalizeGroupName(groupValue), true, 'group-input'],
            ], { orgKey, groupValue });
        }

        function updateGroup(orgKey, groupValue, values) {
            if (!canEdit) return;
            const nextGroup = String(values['環境グループ'] || '').trim();
            if (!nextGroup) return alert(t('error.groupRequired'));
            if (normalizeGroupName(groupValue) === DEFAULT_ENV_GROUP) return alert(t('error.defaultGroupProtected'));
            const beforeGroup = normalizeGroupName(groupValue);
            const normalizedNextGroup = normalizeGroupName(nextGroup);
            const rows = fullData.filter(row => getOrgGroup(row).key === orgKey && envGroupValue(row) === beforeGroup);
            const beforeRows = rows.map(row => cloneForLog(row));
            rows.forEach(row => {
                const beforeRow = cloneForLog(row);
                row['環境グループ'] = normalizedNextGroup;
                moveTagsForRow(beforeRow, row);
            });
            renameEnvGroupInStore(orgKey, beforeGroup, normalizedNextGroup);
            resetPortalDerivedCaches();
            const summary = {
                action: 'edit-group',
                level: 'group',
                org: getOrgOptions().find(item => item.key === orgKey),
                before: { group: beforeGroup, rows: beforeRows },
                after: { group: normalizedNextGroup, rows: rows.map(row => cloneForLog(row)) },
            };
            closeAddModal();
            savePortalFiles(summary)
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    renderTagFilters();
                    renderEnvironments(orgKey);
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function saveEnvironmentCard(rowId) {
            if (!canEdit) return;
            const editor = document.querySelector(`[data-card-editor="${CSS.escape(rowId)}"]`);
            const env = fullData.find(row => row.__rowId === rowId);
            if (!editor || !env) return;
            const beforeEnv = cloneForLog(env);
            const beforeRdp = cloneForLog(relatedRdpRowsForEnv(env));
            const beforeTags = cloneForLog(tagsForRow(env));
            const originalKey = editor.dataset.originalKey || getRowKey(env);
            editor.querySelectorAll('[data-env-field]').forEach(control => {
                if (DATA_FIELDS.includes(control.dataset.envField)) {
                    env[control.dataset.envField] = control.value.trim();
                }
            });
            env['環境グループ'] = normalizeGroupName(env['環境グループ']);
            addGroupNameToOrg(getOrgGroup(env).key, env['環境グループ']);
            delete tagStore[originalKey];
            const tagsInput = editor.querySelector('input[data-env-tags]');
            const tags = String(tagsInput ? tagsInput.value : '')
                .split(',')
                .map(tag => tag.trim())
                .filter(Boolean);
            const updatedKey = getRowKey(env);
            if (tags.length > 0) tagStore[updatedKey] = tags;

            editor.querySelectorAll('[data-rdp-kind]').forEach(group => {
                const values = rdpEditorValues(group);
                const hasAny = RDP_FIELDS.some(field => String(values[field] || '').trim());
                const existingId = group.dataset.rdpRowId || '';
                const existing = existingId ? rdpData.find(row => row.__rowId === existingId) : null;
                if (!hasAny) {
                    if (existing) rdpData = rdpData.filter(row => row.__rowId !== existingId);
                    return;
                }
                const target = existing || { __rowId: `rdp_${Date.now()}_${Math.random().toString(36).slice(2)}` };
                target['組織名'] = env['組織名'] || '';
                RDP_FIELDS.forEach(field => {
                    if (field !== '組織名') target[field] = values[field] || '';
                });
                if (!existing) rdpData.push(target);
            });
            resetPortalDerivedCaches();

            const summary = changeSummaryFor('save-env', beforeEnv, env, {
                beforeRdp,
                afterRdp: relatedRdpRowsForEnv(env),
                beforeTags,
                afterTags: tagsForRow(env),
            });
            savePortalFiles(summary)
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    editingEnvId = '';
                    renderTagFilters();
                    refreshEnvironmentCardInPlace(rowId);
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function addEnvironmentToOrg(orgKey, groupName = '') {
            if (!canEdit) return;
            const org = getOrgOptions().find(item => item.key === orgKey);
            if (!org) return;
            const selectedGroup = normalizeGroupName(groupName);
            openAddModal('env', 'modal.envAdd', [
                ['環境グループ', selectedGroup, false, 'group-select', getEnvGroupsForOrg(org.key)],
                ['構築環境名', t('default.envName'), true],
                ['URL', '', true],
                ['ログインID', ''],
                ['ログインパスワード', ''],
            ], { org, groupName });
        }

        function deleteEnvironmentCard(rowId) {
            if (!canEdit) return;
            if (!confirm(t('confirm.deleteEnv'))) return;
            const env = fullData.find(row => row.__rowId === rowId);
            const beforeEnv = cloneForLog(env);
            const beforeRdp = cloneForLog(relatedRdpRowsForEnv(env));
            const beforeTags = cloneForLog(tagsForRow(env));
            if (env) delete tagStore[getRowKey(env)];
            if (env) {
                const envHost = getHost(env['URL']);
                const dbEndpoint = getEndpoint(env['DB名']);
                rdpData = rdpData.filter(remote => {
                    const remoteEndpoint = getEndpoint(remote['接続先(IP:Port)']);
                    if (envHost && getHost(remote['接続先(IP:Port)']) === envHost) return false;
                    if (dbEndpoint.host && sameEndpoint(remoteEndpoint, dbEndpoint)) return false;
                    return true;
                });
            }
            fullData = fullData.filter(row => row.__rowId !== rowId);
            resetPortalDerivedCaches();
            const summary = changeSummaryFor('delete-env', beforeEnv, null, {
                beforeRdp,
                beforeTags,
            });
            savePortalFiles(summary)
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    renderTagFilters();
                    renderActiveView();
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function savePortalFiles(changeSummary = {}) {
            syncEnvGroupsFromData();
            const dataRows = fullData.map(row => ({ ...row, '環境グループ': envGroupValue(row) }));
            const dataCsv = Papa.unparse({ fields: DATA_FIELDS, data: dataRows }, { quotes: true });
            const rdpCsv = Papa.unparse({ fields: RDP_FIELDS, data: rdpData }, { quotes: true });
            const tagsJson = JSON.stringify(tagStore, null, 2);
            const envGroupsJson = envGroupsJsonForSave();
            return portalFetch('update_portal_bundle.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify({ dataCsv, rdpCsv, tagsJson, envGroupsJson, changeSummary })
            }).then(res => res.ok ? res.text() : Promise.reject(new Error('portal bundle save failed')));
        }

        function copyEnvironmentCard(rowId) {
            if (!canEdit) return;
            const env = fullData.find(row => row.__rowId === rowId);
            if (!env) return;
            const currentOrgKey = getOrgGroup(env).key;
            const orgs = getOrgOptions().filter(org => org.key !== currentOrgKey);
            if (orgs.length === 0) return alert(t('error.noCopyTargetOrg'));
            openAddModal('copy-env', 'modal.envCopy', [
                ['コピー先組織', orgs[0].key, true, 'org-select', orgs],
            ], { rowId });
        }

        function copyEnvironmentToOrg(rowId, targetOrgKey) {
            if (!canEdit) return;
            const env = fullData.find(row => row.__rowId === rowId);
            const targetOrg = getOrgOptions().find(org => org.key === targetOrgKey);
            if (!env || !targetOrg) return;
            const beforeEnv = cloneForLog(env);
            const beforeRdp = cloneForLog(relatedRdpRowsForEnv(env));
            const beforeTags = cloneForLog(tagsForRow(env));

            const newEnv = { ...env };
            newEnv.__rowId = `env_${Date.now()}_${Math.random().toString(36).slice(2)}`;
            newEnv['組織コード'] = targetOrg.code || '';
            newEnv['組織名'] = targetOrg.name || '';
            newEnv['環境グループ'] = envGroupValue(newEnv);
            newEnv['構築環境名'] = `${newEnv['構築環境名'] || t('default.envName')} ${t('suffix.copy')}`;
            addGroupNameToOrg(targetOrg.key, newEnv['環境グループ']);
            fullData.push(newEnv);

            const tags = tagsForRow(env).slice();
            if (tags.length) tagStore[getRowKey(newEnv)] = tags;

            const envHost = getHost(env['URL']);
            const dbEndpoint = getEndpoint(env['DB名']);
            const dbMatches = dbEndpoint.host ? findRemotesByEndpoint(dbEndpoint) : [];
            const apMatches = findRemotesByHost(envHost).filter(remote => !dbMatches.includes(remote));
            const copiedRdpRows = [];
            apMatches.concat(dbMatches).forEach(remote => {
                const copied = { ...remote };
                copied.__rowId = `rdp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                copied['組織名'] = targetOrg.name || '';
                rdpData.push(copied);
                copiedRdpRows.push(copied);
            });
            resetPortalDerivedCaches();

            closeAddModal();
            const summary = changeSummaryFor('copy-env', beforeEnv, newEnv, {
                beforeRdp,
                afterRdp: copiedRdpRows,
                beforeTags,
                afterTags: tagsForRow(newEnv),
                note: `copy to ${targetOrg.label}`,
            });
            savePortalFiles(summary)
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    initDropdown();
                    renderOrgFilterMenu();
                    document.getElementById('orgSelect').value = targetOrg.key;
                    syncProductionNavLink();
                    renderEnvironments(targetOrg.key);
                    editEnvironmentCard(newEnv.__rowId);
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function changePage(direction) {
            currentOrgPage += direction;
            renderInitialSummary();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderInitialSummary() {
            resetStatusWork();
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = ''; 
            
            document.getElementById('orgSelect').value = '';
            renderOrgFilterMenu();
            syncProductionNavLink();

            if (selectedTags.length > 0) {
                renderTagEnvironments();
                return;
            }

            if (canEdit) {
                const toolbar = document.createElement('div');
                toolbar.className = 'org-list-toolbar';
                toolbar.innerHTML = `
                    <div class="org-list-toolbar-title">${t('label.orgList')}</div>
                    <div class="org-level-actions">
                        <button type="button" class="secondary-btn org-add-btn" onclick="addOrganization(event)">${t('button.add')}</button>
                    </div>
                `;
                resultsArea.appendChild(toolbar);
            }

            const orgMap = new Map();
            getFilteredData().forEach(item => {
                const org = getOrgGroup(item);
                const env = (item['構築環境名'] || '').trim();
                if (!org.isUnset) {
                    if (!orgMap.has(org.key)) {
                        orgMap.set(org.key, { ...org, envs: [] });
                    }
                    if (env) {
                        orgMap.get(org.key).envs.push(item);
                    }
                }
            });
            if (selectedTags.length === 0) {
                getOrgOptions().forEach(org => {
                    if (!org.isUnset && !orgMap.has(org.key)) orgMap.set(org.key, { ...org, envs: [] });
                });
            }

            if (orgMap.size === 0) {
                const empty = document.createElement('div');
                empty.style.gridColumn = '1 / -1';
                empty.className = 'empty-state';
                empty.textContent = t('state.noData');
                resultsArea.appendChild(empty);
                return;
            }

            const allOrgs = Array.from(orgMap.values()).sort((a, b) => a.label.localeCompare(b.label));
            const totalPages = Math.ceil(allOrgs.length / ORGS_PER_PAGE);

            if (currentOrgPage > totalPages) currentOrgPage = totalPages;
            if (currentOrgPage < 1) currentOrgPage = 1;

            const startIndex = (currentOrgPage - 1) * ORGS_PER_PAGE;
            const endIndex = Math.min(startIndex + ORGS_PER_PAGE, allOrgs.length);
            const orgsToShow = allOrgs.slice(startIndex, endIndex);

            const wrapper = document.createElement('div');
            wrapper.style.gridColumn = '1 / -1'; 
            
            orgsToShow.forEach(org => {
                const envs = org.envs;
                const envHtml = envs.map((env, index) => renderEnvSummaryBadge(org.key, env, index)).join('');
                
                const card = document.createElement('div');
                card.className = 'org-summary-card';
                card.innerHTML = `
                    <div class="org-summary-header">
                        <div class="org-name-header" onclick="selectOrg('${escapeJs(org.key)}')">
                            <span class="org-name-header-main">${sanitizeHTML(org.label)}</span>
                        </div>
                        ${canEdit ? `
                            <span class="org-level-actions">
                                <button type="button" class="secondary-btn" onclick="openOrganizationEdit('${escapeJs(org.key)}', event)" title="${t('button.edit')}" aria-label="${t('button.edit')}">${editActionIcon()}</button>
                            </span>
                        ` : ''}
                    </div>
                    <div class="org-badges-wrapper">
                        ${envHtml}
                    </div>
                `;
                wrapper.appendChild(card);
            });
            resultsArea.appendChild(wrapper);

            // 渲染分页控件
            if (totalPages > 1) {
                const paginationDiv = document.createElement('div');
                paginationDiv.className = 'pagination';
                
                const prevBtn = document.createElement('button');
                prevBtn.textContent = '‹';
                prevBtn.onclick = () => changePage(-1);
                if (currentOrgPage === 1) prevBtn.disabled = true;

                const pageSpan = document.createElement('span');
                pageSpan.textContent = t('page', { current: currentOrgPage, total: totalPages });

                const nextBtn = document.createElement('button');
                nextBtn.textContent = '›';
                nextBtn.onclick = () => changePage(1);
                if (currentOrgPage === totalPages) nextBtn.disabled = true;

                paginationDiv.appendChild(prevBtn);
                paginationDiv.appendChild(pageSpan);
                paginationDiv.appendChild(nextBtn);
                
                resultsArea.appendChild(paginationDiv);
            }
        }

        function selectOrg(orgKey) {
            document.getElementById('orgSelect').value = orgKey;
            renderOrgFilterMenu();
            syncProductionNavLink();
            renderActiveView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderEnvSummaryBadge(orgKey, env, index) {
            return `
                <div id="env_item_${sanitizeId(orgKey)}_${index}" class="env-flow-item">
                    ${renderEnvSummaryContent(orgKey, env, index)}
                </div>
            `;
        }

        function renderEnvSummaryContent(orgKey, env, index) {
            const envName = sanitizeHTML(env['構築環境名']);
            const host = sanitizeHTML(getHost(env['URL']));
            const url = sanitizeHTML(env['URL']);
            const tags = allTagsForRow(env);
            const visibleTags = tags.slice(0, 5).map(tag => renderTagChip(tag, tagsForRow(env).includes(tag))).join('');
            const overflow = tags.length > 5 ? `<span class="tag-chip auto-tag" style="background:#f5fbfc; color:#627987; border:1px solid #d7e6ee;">+${tags.length - 5}</span>` : '';
            const dbType = String(env['DBタイプ'] || '').trim();
            const dbVersion = String(env['DBバージョン'] || '').trim();
            const meta = dbType ? `${sanitizeHTML(dbType)}${dbVersion ? ' ' + sanitizeHTML(dbVersion) : ''}` : (host || '');
            const badgeId = `env_badge_${sanitizeId(orgKey)}_${index}`;
            const skin = tagSkinForRow(env);
            const skinAttrs = skin
                ? ` data-skin="1" data-skin-tag="${sanitizeHTML(skin.tag)}" data-skin-category="${sanitizeHTML(skin.categoryId)}" style="--env-skin-bg:${sanitizeHTML(skin.skin.bg)}; --env-skin-border:${sanitizeHTML(skin.skin.border)}; --env-skin-accent:${sanitizeHTML(skin.skin.accent)};"`
                : '';
            return `
                <div id="${badgeId}" class="env-badge"${skinAttrs}>
                    <div class="env-summary-main">
                        <div class="env-summary-title">
                            <span class="env-summary-name">◆ ${envName}</span>
                        </div>
                        <div class="env-summary-actions">
                            ${meta ? `<span class="env-summary-meta">${meta}</span>` : ''}
                            <button type="button" class="env-expand-btn" onclick="expandInlineEnv('${escapeJs(orgKey)}', ${index})" title="${t('button.expand')}" aria-label="${t('button.expand')}">${expandIcon()}</button>
                        </div>
                    </div>
                    ${tags.length > 0 ? `<div class="env-summary-tags">${visibleTags}${overflow}</div>` : ''}
                    ${url ? `<div class="env-summary-url">${url}</div>` : ''}
                </div>
            `;
        }

        function renderEnvironments(selectedOrgKey) {
            resetStatusWork();
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = ''; 

            const matchedEnvs = getFilteredData().filter(item => {
                return getOrgGroup(item).key === selectedOrgKey;
            });

            const orgInfo = matchedEnvs[0] ? getOrgGroup(matchedEnvs[0]) : getOrgOptions().find(org => org.key === selectedOrgKey);
            if (!orgInfo) {
                resultsArea.innerHTML = `<div style="grid-column: 1 / -1;" class="empty-state">${t('state.noOrgEnv')}</div>`;
                return;
            }
            const banner = document.createElement('div');
            banner.className = 'active-org-banner';
            banner.innerHTML = `
                <div class="active-org-name">${sanitizeHTML(orgInfo.label)}</div>
                ${canEdit ? `
                    <div class="org-level-actions">
                        <button type="button" class="secondary-btn" onclick="openOrganizationEdit('${escapeJs(selectedOrgKey)}', event)" title="${t('button.edit')}" aria-label="${t('button.edit')}">${editActionIcon()}</button>
                        <button type="button" class="secondary-btn env-add-btn" onclick="openGroupAdd('${escapeJs(selectedOrgKey)}', event)">${t('button.add')}</button>
                    </div>
                ` : ''}
            `;
            resultsArea.appendChild(banner);

            const backBtnWrapper = document.createElement('div');
            backBtnWrapper.style.gridColumn = '1 / -1';
            backBtnWrapper.style.textAlign = 'center';
            backBtnWrapper.style.marginTop = '2rem';
            backBtnWrapper.style.paddingBottom = '2rem';
            backBtnWrapper.innerHTML = `
                <button type="button" class="secondary-btn" onclick="renderInitialSummary()">
                    ${t('button.backList')}
                </button>
            `;
            renderEnvironmentGroupBlocks(matchedEnvs, resultsArea, selectedTags.length > 0, selectedOrgKey, true);
            resultsArea.appendChild(backBtnWrapper);
            startRegisteredStatusChecks();
        }

        function renderEnvironmentGroupBlocks(envs, targetArea, showOrgTitle = false, orgKey = '', includeEmptyGroups = false) {
            const groups = new Map();
            if (includeEmptyGroups && orgKey) {
                getEnvGroupsForOrg(orgKey).forEach(groupName => {
                    groups.set(groupName, { title: groupName, groupValue: groupName, rows: [] });
                });
            }
            envs.forEach(env => {
                const explicitGroup = envGroupValue(env);
                const key = explicitGroup;
                const title = explicitGroup;
                if (!groups.has(key)) groups.set(key, { title, groupValue: explicitGroup, rows: [] });
                groups.get(key).rows.push(env);
            });
            Array.from(groups.values()).forEach(group => {
                const groupBlock = document.createElement('div');
                groupBlock.className = 'env-group-card';
                const title = document.createElement('div');
                title.className = 'env-group-title';
                title.innerHTML = `
                    <span>${sanitizeHTML(group.title || t('unset.name'))}</span>
                    ${canEdit ? `
                        <span class="group-level-actions">
                            ${normalizeGroupName(group.groupValue) === DEFAULT_ENV_GROUP ? '' : `<button type="button" class="secondary-btn" onclick="openGroupEdit('${escapeJs(orgKey || getOrgGroup(group.rows[0]).key)}', '${escapeJs(group.groupValue)}', event)" title="${t('button.edit')}" aria-label="${t('button.edit')}">${editActionIcon()}</button>`}
                            <button type="button" class="secondary-btn env-add-btn" onclick="addEnvironmentToOrg('${escapeJs(orgKey || getOrgGroup(group.rows[0]).key)}', '${escapeJs(group.groupValue)}')">${t('button.add')}</button>
                        </span>
                    ` : ''}
                `;
                const list = document.createElement('div');
                list.className = 'env-group-list';
                if (group.rows.length) {
                    group.rows.forEach(env => list.appendChild(createEnvironmentCard(env, showOrgTitle)));
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state env-group-empty';
                    empty.textContent = t('state.noGroupEnv');
                    list.appendChild(empty);
                }
                groupBlock.appendChild(title);
                groupBlock.appendChild(list);
                targetArea.appendChild(groupBlock);
            });
        }

        function renderTagEnvironments() {
            resetStatusWork();
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '';

            const matchedEnvs = getFilteredData();
            if (matchedEnvs.length === 0) {
                resultsArea.innerHTML = `<div style="grid-column: 1 / -1;" class="empty-state">${t('state.noTagEnv')}</div>`;
                return;
            }

            const orgMap = new Map();
            matchedEnvs.forEach(env => {
                const org = getOrgGroup(env);
                if (!orgMap.has(org.key)) orgMap.set(org.key, { ...org, envs: [] });
                orgMap.get(org.key).envs.push(env);
            });

            const orgs = Array.from(orgMap.values()).sort((a, b) => a.label.localeCompare(b.label));
            const token = ++renderToken;
            let orgIndex = 0;
            const renderNextOrg = () => {
                if (token !== renderToken) return;
                if (orgIndex >= orgs.length) {
                    startRegisteredStatusChecks();
                    return;
                }
                const org = orgs[orgIndex++];
                const section = document.createElement('div');
                section.className = 'tag-org-section';
                section.innerHTML = `
                    <div class="active-org-banner">
                        <div class="active-org-name">${sanitizeHTML(org.label)}</div>
                    </div>
                `;
                resultsArea.appendChild(section);
                renderEnvironmentGroupBlocks(org.envs, section, false);
                renderNextOrg();
            };
            renderNextOrg();
        }

        function renderEnvironmentCardsBatched(envs, showOrgTitle, targetArea, onDone, existingToken) {
            const token = existingToken || ++renderToken;
            let index = 0;
            const renderBatch = () => {
                if (token !== renderToken) return;
                const fragment = document.createDocumentFragment();
                const end = Math.min(index + RENDER_BATCH_SIZE, envs.length);
                for (; index < end; index++) {
                    fragment.appendChild(createEnvironmentCard(envs[index], showOrgTitle));
                }
                targetArea.appendChild(fragment);
                if (index < envs.length) {
                    requestAnimationFrame(renderBatch);
                } else if (onDone) {
                    onDone();
                }
            };
            renderBatch();
        }

        function renderEnvironmentCard(env, showOrgTitle, targetArea, inlineContext) {
            const resultsArea = targetArea || document.getElementById('resultsArea');
            resultsArea.appendChild(createEnvironmentCard(env, showOrgTitle, inlineContext));
        }

        function createEnvironmentCard(env, showOrgTitle, inlineContext) {
            const card = document.createElement('div');
            card.className = 'env-card';
            card.dataset.envRowId = env.__rowId || '';
            card.dataset.showOrgTitle = showOrgTitle ? '1' : '0';

            const org = getOrgGroup(env);
            const safeUrl = sanitizeHTML(env['URL']);
            const safeId = sanitizeHTML(env['ログインID']);
            const safePwd = sanitizeHTML(env['ログインパスワード']);
            const dbName = sanitizeHTML(env['DB名']);
            const dbType = sanitizeHTML(env['DBタイプ']);
            const dbVersion = sanitizeHTML(env['DBバージョン']);
            const dbUser = sanitizeHTML(env['DBユーザー名']);
            const dbPwd = sanitizeHTML(env['DBパスワード']);
            const orgTitleHtml = showOrgTitle ? `<span class="env-org-title">${sanitizeHTML(org.label)}</span>` : '';
            const manualTagSet = new Set(tagsForRow(env));
            const tagHtml = allTagsForRow(env).map(tag => renderTagChip(tag, manualTagSet.has(tag))).join('');
            const dbAutoTagHtml = autoDbTagsForRow(env).map(tag => renderTagChip(tag, false)).join('');
            const skin = tagSkinForRow(env);
            if (skin) {
                card.dataset.skin = '1';
                card.dataset.skinTag = skin.tag;
                card.dataset.skinCategory = skin.categoryId;
                card.style.setProperty('--env-skin-bg', skin.skin.bg);
                card.style.setProperty('--env-skin-border', skin.skin.border);
                card.style.setProperty('--env-skin-accent', skin.skin.accent);
            }

            const statusBadgeId = 'status_' + Math.random().toString(36).substr(2, 9);
            const statusMetaId = 'meta_' + Math.random().toString(36).substr(2, 9);
            const urlLinkId = 'url_' + Math.random().toString(36).substr(2, 9);
            const browseBtnId = 'browse_' + Math.random().toString(36).substr(2, 9);
            const rdpDownloadBtnId = 'rdpdl_' + Math.random().toString(36).substr(2, 9);
            const rdpCertBtnId = 'rdpcert_' + Math.random().toString(36).substr(2, 9);
            const dbRdpDownloadBtnId = 'dbrdpdl_' + Math.random().toString(36).substr(2, 9);
            const dbRdpCertBtnId = 'dbrdpcert_' + Math.random().toString(36).substr(2, 9);

            const guacamoleAvailable = portalConfig.guacamoleEnabled && portalConfig.guacamoleAvailable !== false;
            const envHost = getHost(safeUrl);
            const dbHost = getHost(env['DB名']);
            const dbEndpoint = getEndpoint(env['DB名']);
            const matchedDbRdps = dbEndpoint.host ? findRemotesByEndpoint(dbEndpoint) : [];
            const matchedRdps = findRemotesByHost(envHost)
                .filter(remote => !matchedDbRdps.includes(remote));
            const remoteTypes = uniqueTags(matchedRdps.map(remote => detectRemoteType(remote)).filter(Boolean));
            const dbRemoteTypes = uniqueTags(matchedDbRdps.map(remote => detectRemoteType(remote)).filter(Boolean));
            const rdpDownloadBtnIds = [];
            const rdpCertBtnIds = [];
            const guacamoleBtnIds = [];

            let rdpTagHtml = '';
            let apRdpInfoHtml = '';
            let dbRdpInfoHtml = '';
            const isEditingCard = canEdit && editingEnvId === env.__rowId;

            function renderRemoteInfo(remote, sectionLabel, downloadBtnId, certBtnId, fileSuffix, itemIndex, totalItems, embedded = false) {
                if (!remote) return '';
                const currentRemoteType = detectRemoteType(remote);
                const remoteTagHtml = currentRemoteType ? renderTagChip(currentRemoteType, false) : '';
                const remoteTarget = sanitizeHTML(remote['接続先(IP:Port)']);
                const remoteUser = sanitizeHTML(remote['RDPユーザー名']);
                const sectionTitle = totalItems > 1 ? `${sectionLabel} ${itemIndex + 1}` : sectionLabel;
                const wrapperClass = embedded ? 'db-remote-section' : 'info-subcard';
                const downloadBtn = currentRemoteType === 'RDP' && remoteTarget
                    ? `<button id="${downloadBtnId}" class="icon-btn" disabled onclick="openRdpConnection('${escapeJs(remote['接続先(IP:Port)'])}', '${escapeJs(remote['RDPユーザー名'])}', '${escapeJs(remote['RDPパスワード'])}', '${escapeJs(env['組織名'])}', '${escapeJs(env['構築環境名'])}${fileSuffix}${totalItems > 1 ? '_' + (itemIndex + 1) : ''}')" title="${t('button.downloadRdp')}" aria-label="${t('button.downloadRdp')}">${rdpFileDownloadIcon()}</button>`
                    : '';
                const guacamoleBtnId = `${downloadBtnId}_guac`;
                const guacamoleBtn = currentRemoteType === 'RDP' && remoteTarget && guacamoleAvailable
                    ? `<button id="${guacamoleBtnId}" class="icon-btn" disabled onclick="openGuacamoleConnection('${escapeJs(remote['接続先(IP:Port)'])}', '${escapeJs(remote['RDPユーザー名'])}', '${escapeJs(remote['RDPパスワード'])}')" title="${t('button.openGuacamole')}" aria-label="${t('button.openGuacamole')}">${remoteConnectIcon()}</button>`
                    : '';
                const certBtn = currentRemoteType === 'RDP'
                    ? `<button id="${certBtnId}" class="icon-btn" disabled onclick="downloadRdpSigningCert()" title="${t('button.downloadRdpCert')}" aria-label="${t('button.downloadRdpCert')}">${certificateIcon()}</button>`
                    : '';

                if (downloadBtn) rdpDownloadBtnIds.push(downloadBtnId);
                if (certBtn) rdpCertBtnIds.push(certBtnId);
                if (guacamoleBtn) guacamoleBtnIds.push(guacamoleBtnId);

                if (isAuthenticated) {
                    return `
                        <div class="${wrapperClass}">
                            <div class="db-section-title">
                                <span>${sectionTitle}</span>
                                ${remoteTagHtml ? `<span class="db-title-tags">${remoteTagHtml}</span>` : ''}
                            </div>
                            <div class="env-detail">
                                <div class="env-detail-label" style="color:var(--text-main);">${t('label.remoteUser')}</div>
                                <div class="env-detail-value">${remoteUser || `<span style="color:#aaa;">${t('unset.value')}</span>`}</div>
                                <button class="icon-btn" onclick="copyText('${sanitizeHTML(remote['RDPユーザー名'])}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                            </div>
                            <div class="env-detail">
                                <div class="env-detail-label" style="color:var(--text-main);">${t('label.remotePassword')}</div>
                                <div class="env-detail-value">${sanitizeHTML(remote['RDPパスワード']) || `<span style="color:#aaa;">${t('unset.value')}</span>`}</div>
                                <button class="icon-btn" onclick="copyText('${sanitizeHTML(remote['RDPパスワード'])}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                            </div>
                            <div class="env-detail" style="border: none;">
                                <div class="env-detail-label" style="color:var(--text-main);">${t('label.connection')}</div>
                                <div class="env-detail-value">${remoteTarget || `<span style="color:#aaa;">${t('unset.value')}</span>`}</div>
                                ${downloadBtn}
                                ${guacamoleBtn}
                                ${certBtn}
                                <button class="icon-btn" onclick="copyText('${sanitizeHTML(remote['接続先(IP:Port)'])}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                            </div>
                        </div>
                    `;
                }
                return '';
            }

            function renderRemoteGroup(remotes, sectionLabel, idPrefix, certIdPrefix, fileSuffix, embedded = false) {
                return remotes.map((remote, index) => renderRemoteInfo(
                    remote,
                    sectionLabel,
                    `${idPrefix}_${index}`,
                    `${certIdPrefix}_${index}`,
                    fileSuffix,
                    index,
                    remotes.length,
                    embedded
                )).join('');
            }

            apRdpInfoHtml = renderRemoteGroup(matchedRdps, t('section.rdp'), rdpDownloadBtnId, rdpCertBtnId, '');
            dbRdpInfoHtml = renderRemoteGroup(matchedDbRdps, t('section.dbRdp'), dbRdpDownloadBtnId, dbRdpCertBtnId, '_DB', true);

            if ((matchedRdps.length || matchedDbRdps.length) && !isAuthenticated) {
                const remoteLabels = uniqueTags(remoteTypes.concat(dbRemoteTypes)).join(' / ') || t('label.remoteAccess');
                rdpTagHtml = `<span class="rdp-tag" onclick="openPwdModal()" title="${t('modal.rdpUnlockDesc')}">${remoteLabels}</span>`;
            }

            const editActionButtonsHtml = canEdit ? `
                    ${isEditingCard
                        ? `<button type="button" class="primary-btn" onclick="saveEnvironmentCard('${escapeJs(env.__rowId)}')" title="${t('button.save')}" aria-label="${t('button.save')}">${saveActionIcon()}</button>`
                        : `<button type="button" class="secondary-btn" onclick="editEnvironmentCard('${escapeJs(env.__rowId)}')" title="${t('button.edit')}" aria-label="${t('button.edit')}">${editActionIcon()}</button>`}
                    ${!isEditingCard ? `<button type="button" class="secondary-btn copy-btn" onclick="copyEnvironmentCard('${escapeJs(env.__rowId)}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>` : ''}
                    ${isEditingCard ? `<button type="button" class="secondary-btn cancel-btn" onclick="cancelEnvironmentCardEdit()" title="${t('button.cancel')}" aria-label="${t('button.cancel')}">${cancelActionIcon()}</button>` : ''}
                    ${isEditingCard ? `<button type="button" class="secondary-btn delete-btn" onclick="deleteEnvironmentCard('${escapeJs(env.__rowId)}')" title="${t('button.delete')}" aria-label="${t('button.delete')}">${trashIcon()}</button>` : ''}
            ` : '';
            const collapseActionHtml = inlineContext ? `
                <button type="button" class="secondary-btn env-collapse-btn" data-org-key="${sanitizeHTML(inlineContext.orgKey)}" onclick="collapseInlineEnvFromButton(this)" title="${t('button.collapse')}" aria-label="${t('button.collapse')}">${collapseIcon()}</button>
            ` : '';
            const actionAreaHtml = (editActionButtonsHtml || collapseActionHtml) ? `
                    <div class="env-card-action-area">
                        <span class="card-edit-actions">
                            ${editActionButtonsHtml}
                            ${collapseActionHtml}
                        </span>
                    </div>
            ` : '';
            const viewBodyHtml = `
                <div id="${statusMetaId}" class="env-status-meta"></div>
                <div class="env-detail-wrapper">
                    <div class="env-detail">
                        <div class="env-detail-label">${t('label.url')}</div>
                        <div class="env-detail-value"><a id="${urlLinkId}" href="${safeUrl}" data-href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a></div>
                        <button id="${browseBtnId}" class="icon-btn" type="button" data-url="${safeUrl}" onclick="openBrowse(this)" title="Browse" aria-label="Browse">${globeIcon()}</button>
                        <button class="icon-btn" onclick="copyText('${safeUrl}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                    </div>
                    <div class="env-detail">
                        <div class="env-detail-label">ID</div>
                        <div class="env-detail-value">${safeId}</div>
                        <button class="icon-btn" onclick="copyText('${safeId}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                    </div>
                    <div class="env-detail">
                        <div class="env-detail-label">${t('label.password')}</div>
                        <div class="env-detail-value"><span>${safePwd}</span></div>
                        <button class="icon-btn" onclick="copyText('${safePwd}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                    </div>
                    <div class="info-subcard">
                        <div class="db-section-title">
                            <span>${t('section.db')}</span>
                            ${dbAutoTagHtml ? `<span class="db-title-tags">${dbAutoTagHtml}</span>` : ''}
                        </div>
                        <div class="env-detail">
                            <div class="env-detail-label" style="color:var(--text-main);">DB名</div>
                            <div class="env-detail-value">${dbName || `<span style="color:#aaa;">${t('unset.value')}</span>`}</div>
                            <button class="icon-btn" onclick="copyText('${dbName}')" title="${t('button.copy')}" aria-label="${t('button.copy')}" ${!dbName ? 'disabled' : ''}>${copyIcon()}</button>
                        </div>
                        <div class="env-detail">
                            <div class="env-detail-label" style="color:var(--text-main);">DBユーザ</div>
                            <div class="env-detail-value">${dbUser || `<span style="color:#aaa;">${t('unset.value')}</span>`}</div>
                            <button class="icon-btn" onclick="copyText('${dbUser}')" title="${t('button.copy')}" aria-label="${t('button.copy')}" ${!dbUser ? 'disabled' : ''}>${copyIcon()}</button>
                        </div>
                        <div class="env-detail" style="border: none;">
                            <div class="env-detail-label" style="color:var(--text-main);">${t('label.dbPwd')}</div>
                            <div class="env-detail-value"><span>${dbPwd || `<span style="color:#aaa;">${t('unset.value')}</span>`}</span></div>
                            <button class="icon-btn" onclick="copyText('${dbPwd}')" title="${t('button.copy')}" aria-label="${t('button.copy')}" ${!dbPwd ? 'disabled' : ''}>${copyIcon()}</button>
                        </div>
                        ${dbRdpInfoHtml}
                    </div>
                    ${apRdpInfoHtml}
                </div>
            `;

            card.innerHTML = `
                <div class="env-card-title-wrap">
                    <div class="env-card-title-row">
                    <span class="env-card-title-main">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: sub;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        ${sanitizeHTML(env['構築環境名'])}
                        ${orgTitleHtml}
                        <span id="${statusBadgeId}" style="font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; background-color: #f7f7f7; color: #888; font-weight: bold; border: 1px solid #e0e0e0; display: none; align-items: center; gap: 5px;">
                            <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background-color:#ccc;"></span>${t('status.checking')}
                        </span>
                    </span>
                    ${actionAreaHtml}
                    </div>
                    ${rdpTagHtml ? `<div class="env-card-status-row">${rdpTagHtml}</div>` : ''}
                    ${tagHtml ? `<div class="env-card-tag-row">${tagHtml}</div>` : ''}
                </div>
                ${isEditingCard ? renderEnvironmentCardEditor(env, matchedRdps, matchedDbRdps) : viewBodyHtml}
            `;
            if (safeUrl && !isEditingCard) {
                card.dataset.statusUrl = safeUrl;
                card.dataset.statusBadgeId = statusBadgeId;
                card.dataset.statusMetaId = statusMetaId;
                card.dataset.urlLinkId = urlLinkId;
                card.dataset.browseBtnId = browseBtnId;
                card.dataset.rdpDownloadBtnId = rdpDownloadBtnIds.join(',');
                card.dataset.rdpCertBtnId = rdpCertBtnIds.join(',');
                card.dataset.guacamoleBtnId = guacamoleBtnIds.join(',');
                registerStatusCard(card);
            }
            return card;
        }

        function expandInlineEnv(orgKey, envIndex) {
            const item = document.getElementById(`env_item_${sanitizeId(orgKey)}_${envIndex}`);
            if (!item || item.classList.contains('expanded')) return;
            const envs = getFilteredData().filter(item => getOrgGroup(item).key === orgKey);
            const env = envs[envIndex];
            if (!env) return;
            item.innerHTML = '';
            item.classList.add('expanded');
            renderEnvironmentCard(env, false, item, { orgKey });
            startRegisteredStatusChecks();
        }

        function collapseInlineEnvFromButton(button) {
            if (!button) return;
            collapseInlineEnv(button.dataset.orgKey || '', button.closest('.env-flow-item'));
        }

        function collapseInlineEnv(orgKey, item) {
            if (!item) return;
            const match = item.id.match(/_(\d+)$/);
            const envIndex = match ? Number(match[1]) : -1;
            if (envIndex < 0) return;
            const envs = getFilteredData().filter(row => getOrgGroup(row).key === orgKey);
            const env = envs[envIndex];
            if (!env) return;
            item.classList.remove('expanded');
            item.innerHTML = renderEnvSummaryContent(orgKey, env, envIndex);
        }

        function sanitizeId(str) {
            return String(str || '').replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function scheduleStatusRefresh() {
            if (statusRefreshTimer) clearTimeout(statusRefreshTimer);
            statusRefreshTimer = setTimeout(() => {
                refreshVisibleStatuses();
                scheduleStatusRefresh();
            }, STATUS_REFRESH_MS);
        }

        function refreshVisibleStatuses() {
            document.querySelectorAll('[data-status-url]').forEach(el => {
                if (el.dataset.statusObserved === '1') queueStatusCheck(el, true);
            });
        }

        function resetStatusWork() {
            renderToken++;
            statusQueue = [];
            registeredStatusCards = [];
            activeStatusChecks = 0;
            if (statusRefreshTimer) {
                clearTimeout(statusRefreshTimer);
                statusRefreshTimer = null;
            }
        }

        function registerStatusCard(card) {
            if (!card || !card.dataset.statusUrl) return;
            registeredStatusCards.push(card);
        }

        function startRegisteredStatusChecks() {
            registeredStatusCards.forEach(card => {
                if (card && card.isConnected) {
                    card.dataset.statusObserved = '1';
                    queueStatusCheck(card);
                }
            });
            registeredStatusCards = [];
            scheduleStatusRefresh();
        }

        function queueStatusCheck(card, force = false) {
            if (!card || !card.dataset.statusUrl) return;
            if (!force && card.dataset.statusQueued === '1') return;
            card.dataset.statusQueued = '1';
            statusQueue.push(card);
            runStatusQueue();
        }

        function runStatusQueue() {
            while (activeStatusChecks < STATUS_CHECK_CONCURRENCY && statusQueue.length > 0) {
                const card = statusQueue.shift();
                if (!card || !card.isConnected) continue;
                activeStatusChecks++;
                updateStatusBadge(
                    card.dataset.statusBadgeId,
                    card.dataset.statusMetaId,
                    card.dataset.statusUrl,
                    card.dataset.urlLinkId,
                    card.dataset.browseBtnId,
                    card.dataset.rdpDownloadBtnId,
                    card.dataset.rdpCertBtnId,
                    card.dataset.guacamoleBtnId
                ).finally(() => {
                    activeStatusChecks = Math.max(0, activeStatusChecks - 1);
                    if (card && card.isConnected) card.dataset.statusQueued = '0';
                    runStatusQueue();
                });
            }
        }

        function updateStatusBadge(statusBadgeId, statusMetaId, safeUrl, urlLinkId, browseBtnId, rdpDownloadBtnId, rdpCertBtnId, guacamoleBtnId) {
            const badge = document.getElementById(statusBadgeId);
            const meta = document.getElementById(statusMetaId);
            const startedAt = performance.now();
            const signal = AbortSignal.timeout ? AbortSignal.timeout(1800) : undefined;
            if (badge) badge.style.display = 'flex';
            return portalFetch('env_check.jsp?url=' + encodeURIComponent(safeUrl), signal ? { signal } : {})
                .then(res => res.text())
                .then(text => {
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('env_check returned non-json');
                    }
                })
                .then(info => {
                    if (!badge) return;
                    const status = String(info.status || '').trim();
                    renderStatusBadge(badge, status);
                    updateUrlAccess(status, urlLinkId, browseBtnId, rdpDownloadBtnId, rdpCertBtnId, guacamoleBtnId);
                    if (status === 'ERROR') {
                        throw new Error('env_check status error');
                    }
                    if (meta) {
                        const parts = [];
                        parts.push(t('status.http', { status }));
                        if (info.elapsedMs || info.elapsedMs === 0) parts.push(t('status.responseTime', { ms: info.elapsedMs }));
                        const headerGuess = info.platform && info.platform !== 'Unknown' ? info.platform : '';
                        const ttlGuess = info.ttlGuess && info.ttlGuess !== 'Unknown' ? info.ttlGuess : '';
                        const bestGuess = headerGuess || ttlGuess;
                        if (bestGuess) {
                            parts.push(`${t('status.osGuess')}: ${sanitizeHTML(bestGuess)}`);
                        }
                        if (info.ttl) parts.push(t('status.ttl', { ttl: sanitizeHTML(info.ttl) }));
                        if (info.server) parts.push(`${t('status.server')}: ${sanitizeHTML(info.server)}`);
                        if (info.poweredBy) parts.push(sanitizeHTML(info.poweredBy));
                        meta.innerHTML = parts.map(part => `<span>${part}</span>`).join('');
                    }
                })
                .catch(() => {
                    return portalFetch('ping.jsp?url=' + encodeURIComponent(safeUrl), signal ? { signal } : {})
                        .then(res => res.text())
                        .then(txt => {
                            if (!badge) return;
                            const status = normalizeHttpStatus(txt);
                            renderStatusBadge(badge, status);
                            updateUrlAccess(status, urlLinkId, browseBtnId, rdpDownloadBtnId, rdpCertBtnId, guacamoleBtnId);
                            if (meta) {
                                const elapsed = Math.round(performance.now() - startedAt);
                                meta.innerHTML = [
                                    t('status.basicCheck'),
                                    t('status.http', { status }),
                                    t('status.responseTime', { ms: elapsed })
                                ].map(part => `<span>${part}</span>`).join('');
                            }
                        })
                        .catch(() => {
                            if (!badge) return;
                            renderStatusBadge(badge, 'ERROR');
                            updateUrlAccess('ERROR', urlLinkId, browseBtnId, rdpDownloadBtnId, rdpCertBtnId, guacamoleBtnId);
                            if (meta) {
                                const elapsed = Math.round(performance.now() - startedAt);
                                meta.innerHTML = [
                                    t('status.basicCheck'),
                                    t('status.http', { status: 'ERROR' }),
                                    t('status.responseTime', { ms: elapsed })
                                ].map(part => `<span>${part}</span>`).join('');
                            }
                        });
                });
        }

        function updateUrlAccess(status, urlLinkId, browseBtnId, rdpDownloadBtnId, rdpCertBtnId, guacamoleBtnId) {
            const isAvailable = String(status).trim() === '200';
            const link = document.getElementById(urlLinkId);
            const browseBtn = document.getElementById(browseBtnId);
            const rdpDownloadBtns = getElementsByCsvIds(rdpDownloadBtnId);
            const rdpCertBtns = getElementsByCsvIds(rdpCertBtnId);
            const guacamoleBtns = getElementsByCsvIds(guacamoleBtnId);
            if (link) {
                if (isAvailable) {
                    link.href = link.dataset.href || link.textContent;
                    link.classList.remove('disabled-link');
                } else {
                    link.removeAttribute('href');
                    link.classList.add('disabled-link');
                }
            }
            if (browseBtn) browseBtn.disabled = !isAvailable;
            rdpDownloadBtns.forEach(btn => { btn.disabled = !isAvailable; });
            rdpCertBtns.forEach(btn => { btn.disabled = !isAvailable; });
            guacamoleBtns.forEach(btn => { btn.disabled = !isAvailable; });
        }

        function getElementsByCsvIds(ids) {
            return String(ids || '')
                .split(',')
                .map(id => document.getElementById(id.trim()))
                .filter(Boolean);
        }

        function normalizeHttpStatus(value) {
            const status = String(value || '').trim();
            return /^\d{3}$/.test(status) ? status : 'ERROR';
        }

        function openBrowse(button) {
            if (!button.disabled && button.dataset.url) {
                window.open(button.dataset.url, '_blank', 'noopener,noreferrer');
            }
        }

        function copyIcon() {
            return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
        }

        function editActionIcon() {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19V6.5A2.5 2.5 0 0 1 6.5 4H13"></path><path d="M14 19H4"></path><path d="M8 16l2.7-.7L19 7a2.1 2.1 0 0 0-3-3L7.7 12.3 7 15z"></path></svg>';
        }

        function saveActionIcon() {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l3 3v15H5z"></path><path d="M8 3v6h8V3"></path><path d="M8 21v-7h8v7"></path></svg>';

        function isLocalPortal() {

        function openRdpConnection(target, user, password, orgName, envName) {
            showRemoteLoading();

        function openGuacamoleConnection(target, user, password) {
            if (!portalConfig.guacamoleEnabled || portalConfig.guacamoleAvailable === false) {
                showToast(t('toast.guacamoleDisabled'));
                return;
            }
            showRemoteLoading();
            const params = new URLSearchParams();
            params.set('target', target || '');
            params.set('user', user || '');
            params.set('password', password || '');

            portalFetch('guacamole_connect.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
                .then(res => res.json().then(data => ({ ok: res.ok && data.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.message || 'Guacamole connection failed');
                    if (data.mode === 'direct' && data.url) {
                        window.open(data.url, '_blank', 'noopener,noreferrer');
                        return;
                    }
                    if (data.quickconnectUri) {
                        return copyTextSilently(data.quickconnectUri).then(() => {
                            showToast(data.message || t('toast.guacamoleManual'));
                            window.open(data.guacamoleUrl || portalConfig.guacamoleUrl, '_blank', 'noopener,noreferrer');
                        });
                    }
                    window.open(data.guacamoleUrl || portalConfig.guacamoleUrl, '_blank', 'noopener,noreferrer');
                })
                .catch(err => {
                    console.error(err);
                    alert(t('error.network'));
                })
                .finally(hideRemoteLoading);
        }

        function connectRdp(target, user, password) {
            const params = new URLSearchParams();
            params.set('target', target || '');
            params.set('user', user || '');
            params.set('password', password || '');

            copyRdpPasswordToClipboard(password)
                .then(() => portalFetch('rdp_connect.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
                }))
                .then(res => res.json().then(data => ({ ok: res.ok && data.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.message || 'RDP connect failed');
                    showToast(t('toast.rdpConnecting'));
                })
                .catch(err => {
                    console.error(err);
                    alert(t('error.network'));
                })
                .finally(hideRemoteLoading);

        function copyRdpPasswordToClipboard(password) {
            const value = String(password || '');
            if (!value) return Promise.resolve();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(value)
                    .then(() => showToast(t('toast.passwordCopiedForRdp')))
                    .catch(() => fallbackCopyRdpPassword(value));
            }
            return fallbackCopyRdpPassword(value);
        }

        function copyTextSilently(text) {
            const value = String(text || '');
            if (!value) return Promise.resolve();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(value).catch(() => fallbackCopyTextSilently(value));
            }
            return fallbackCopyTextSilently(value);
        }

        function fallbackCopyTextSilently(text) {
            return new Promise(resolve => {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.top = '-9999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                } finally {
                    document.body.removeChild(textArea);
                    resolve();
                }
            });
        }

        function fallbackCopyRdpPassword(password) {
            return new Promise(resolve => {
                const textArea = document.createElement('textarea');
                textArea.value = password;
                textArea.style.position = 'fixed';
                textArea.style.top = '-9999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(t('toast.passwordCopiedForRdp'));
                } finally {
                    document.body.removeChild(textArea);
                    resolve();
                }
            });
        }

        function downloadRdpFile(target, user, password, orgName, envName, toastMessage) {
            const params = new URLSearchParams();
            params.set('target', target || '');
            params.set('user', user || '');
            params.set('password', password || '');
            params.set('org', orgName || '');
            params.set('env', envName || '');

            return portalFetch('rdp_file.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
                .then(res => {
                    if (!res.ok) throw new Error('RDP file generation failed');
                    return res.blob().then(blob => ({ blob, disposition: res.headers.get('Content-Disposition') || '' }));
                })
                .then(({ blob, disposition }) => {
                    const nameMatch = disposition.match(/filename\*=UTF-8''([^;]+)/);
                    const filename = nameMatch ? decodeURIComponent(nameMatch[1]) : `${safeFilePart(orgName)}_${safeFilePart(envName)}.rdp`;
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast(toastMessage || t('toast.rdpDownloaded'));
                })
                .catch(err => {
                    console.error(err);
                    alert(t('error.network'));
                });
        }

        function safeFilePart(value) {
            return String(value || 'remote').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'remote';
        }

        function renderStatusBadge(badge, status) {

            } else if (status && status !== 'ERROR') {
                badge.style.backgroundColor = '#ffebee';
                badge.style.color = '#c62828';
                badge.style.border = '1px solid #ef9a9a';
                badge.innerHTML = `<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background-color:#f44336;"></span>${t('status.down')} (HTTP ${sanitizeHTML(status)})`;
            } else {
                badge.style.backgroundColor = '#ffebee';
                badge.style.color = '#c62828';
                badge.style.border = '1px solid #ef9a9a';
                badge.innerHTML = `<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background-color:#f44336;"></span>${t('status.error')}`;
