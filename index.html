        function sanitizeHTML(str) {
            if (!str) return '';
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        function normalizeTagStore(tagsJson) {
            if (!tagsJson || typeof tagsJson !== 'object') return {};
            if (tagsJson.records && typeof tagsJson.records === 'object') return tagsJson.records;
            return tagsJson;
        }

        function orgKeyFromParts(code, name) {
            const orgCode = String(code || '').trim();
            const orgName = String(name || '').trim();
            if (!orgCode && !orgName) return '__unset__';
            return orgCode || `name:${orgName}`;
        }

        function normalizeGroupName(value) {
            return String(value || '').trim() || DEFAULT_ENV_GROUP;
        }

        function normalizeEnvGroupStore(raw) {
            const source = raw && typeof raw === 'object' ? raw : {};
            const rawRecords = source.records && typeof source.records === 'object' ? source.records : source;
            const records = {};
            Object.keys(rawRecords || {}).forEach(key => {
                const value = rawRecords[key];
                let code = '';
                let name = '';
                let groups = [];
                let orgKey = String(key || '').trim();
                if (!orgKey || orgKey === '__unset__') return;
                if (Array.isArray(value)) {
                    code = orgKey.startsWith('name:') ? '' : orgKey;
                    name = orgKey.startsWith('name:') ? orgKey.slice(5) : '';
                    groups = value;
                } else if (value && typeof value === 'object') {
                    code = String(value.code || '').trim();
                    name = String(value.name || '').trim();
                    groups = Array.isArray(value.groups) ? value.groups : [];
                    orgKey = orgKeyFromParts(code, name) !== '__unset__' ? orgKeyFromParts(code, name) : orgKey;
                }
                records[orgKey] = {
                    key: orgKey,
                    code,
                    name,
                    groups: uniqueTags([DEFAULT_ENV_GROUP].concat(groups.map(normalizeGroupName)))
                };
            });
            return { records };
        }

        function ensureEnvGroupRecord(org) {
            if (!org || org.isUnset) return null;
            const key = org.key || orgKeyFromParts(org.code, org.name);
            if (!envGroupStore.records[key]) {
                envGroupStore.records[key] = {
                    key,
                    code: org.code || '',
                    name: org.name || '',
                    groups: [DEFAULT_ENV_GROUP]
                };
            } else {
                envGroupStore.records[key].code = org.code || envGroupStore.records[key].code || '';
                envGroupStore.records[key].name = org.name || envGroupStore.records[key].name || '';
                envGroupStore.records[key].groups = uniqueTags([DEFAULT_ENV_GROUP].concat((envGroupStore.records[key].groups || []).map(normalizeGroupName)));
            }
            return envGroupStore.records[key];
        }

        function syncEnvGroupsFromData() {
            fullData.forEach(row => {
                const org = getOrgGroup(row);
                const record = ensureEnvGroupRecord(org);
                if (!record) return;
                const group = envGroupValue(row);
                if (!record.groups.includes(group)) record.groups.push(group);
            });
        }

        function envGroupsJsonForSave() {
            Object.values(envGroupStore.records || {}).forEach(record => {
                record.groups = uniqueTags([DEFAULT_ENV_GROUP].concat((record.groups || []).map(normalizeGroupName)));
            });
            return JSON.stringify(envGroupStore, null, 2);
        }

        function normalizeTagCategories(config) {
            const source = config && typeof config === 'object' ? config : {};
            const categories = Array.isArray(source.categories) ? source.categories : [];
            const cleaned = [];
            const seen = new Set();
            categories.forEach(category => {
                if (!category || typeof category !== 'object') return;
                const id = normalizeCategoryId(category.id);
                if (!id || id === 'other' || seen.has(id)) return;
                cleaned.push({
                    id,
                    label: String(category.label || id).trim() || id,
                    protected: false
                });
                seen.add(id);
            });
            cleaned.push({ id: 'other', label: '其他', protected: true });
            const validIds = new Set(cleaned.map(category => category.id));
            const assignments = {};
            const rawAssignments = source.assignments && typeof source.assignments === 'object' ? source.assignments : {};
            Object.keys(rawAssignments).forEach(tag => {
                const tagName = String(tag || '').trim();
                if (!tagName) return;
                const id = normalizeCategoryId(rawAssignments[tag]);
                assignments[tagName] = validIds.has(id) ? id : 'other';
            });
            const skins = {};
            const rawSkins = source.skins && typeof source.skins === 'object' ? source.skins : {};
            Object.keys(rawSkins).forEach(categoryId => {
                const id = normalizeCategoryId(categoryId);
                if (!validIds.has(id) || !rawSkins[categoryId] || typeof rawSkins[categoryId] !== 'object') return;
                skins[id] = {};
                Object.keys(rawSkins[categoryId]).forEach(tag => {
                    const tagName = String(tag || '').trim();
                    const skin = normalizeTagSkin(rawSkins[categoryId][tag]);
                    if (tagName && skin) skins[id][tagName] = skin;
                });
            });
            const activeSkinCategory = validIds.has(normalizeCategoryId(source.activeSkinCategory))
                ? normalizeCategoryId(source.activeSkinCategory)
                : 'other';
            return { categories: cleaned, assignments, skins, activeSkinCategory };
        }

        function normalizeCategoryId(value) {
            return String(value || '').trim().replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase();
        }

        function tagCategoryLabel(category) {
            if (category && category.id === 'other') return t('tagGroup.other');
            return String((category && category.label) || '').trim() || '';
        }

        function normalizeTagSkin(value) {
            if (!value || typeof value !== 'object') return null;
            const bg = normalizeHexColor(value.bg);
            const border = normalizeHexColor(value.border);
            const accent = normalizeHexColor(value.accent);
            if (!bg || !border || !accent) return null;
            return { bg, border, accent };
        }

        function normalizeHexColor(value) {
            const text = String(value || '').trim();
            return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toLowerCase() : '';
        }

        function getRowKey(row) {
            return [
                row['組織コード'] || '',
                row['組織名'] || '',
                row['構築環境名'] || '',
                row['URL'] || '',
                row['ログインID'] || ''
            ].map(value => String(value).trim()).join('||');
        }

        function tagsForRow(row) {
            const record = tagStore[getRowKey(row)] || tagStore[getLegacyRowKey(row)];
            if (Array.isArray(record)) return record;
            if (record && Array.isArray(record.tags)) return record.tags;
            return [];
        }

        function autoEnvTagsForRow(row) {
            const group = envGroupValue(row);
            const name = String(row['構築環境名'] || '').trim();
            return uniqueTags([
                group,
                ...productTagsFromText(group),
                ...productTagsFromText(name)
            ].filter(Boolean));
        }

        function productTagsFromText(value) {
            const upper = String(value || '').trim().toUpperCase();
            const compact = upper.replace(/[^A-Z0-9]+/g, '');
            const tags = [];
            if (upper.includes('UHR')) tags.push('UHR');
            if (upper.includes('PHR')) tags.push('PHR');
            const isUpds = compact.includes('UPDS');
            if (isUpds && compact.includes('V6')) tags.push('UPDS-V6');
            if (isUpds && compact.includes('V7')) tags.push('UPDS-V7');
            return uniqueTags(tags);
        }

        function autoDbTagsForRow(row) {
            const type = String(row['DBタイプ'] || '').trim();
            const version = String(row['DBバージョン'] || '').trim();
            const tags = [];
            if (type) tags.push(type);
            if (type && version) tags.push(`${type} ${version}`);
            else if (version) tags.push(`DB ${version}`);
            return tags;
        }

        function autoRemoteTagsForRow(row) {
            const envHost = getHost(row['URL']);
            const dbHost = getHost(row['DB名']);
            return uniqueTags([envHost, dbHost]
                .filter(Boolean)
                .flatMap(host => findRemotesByHost(host))
                .filter(Boolean)
                .map(remote => detectRemoteType(remote))
                .filter(Boolean));
        }

        function detectRemoteType(remote) {
            const explicitType = String(remote['接続タイプ'] || remote['接続種別'] || remote['タイプ'] || '').trim();
            if (explicitType) return explicitType.toUpperCase();
            const target = String(remote['接続先(IP:Port)'] || '');
            const portMatch = target.match(/:(\d+)\s*$/);
            const port = portMatch ? portMatch[1] : '';
            if (port === '22') return 'SSH';
            if (port === '3389') return 'RDP';
            return '';
        }

        function autoTagsForRow(row) {
            return AUTO_TAG_PROVIDERS
                .flatMap(provider => provider(row))
                .filter(Boolean);
        }

        function allTagsForRow(row) {
            const cacheKey = row && row.__rowId ? row.__rowId : getLegacyRowKey(row || {});
            if (cacheKey && rowTagCache.has(cacheKey)) return rowTagCache.get(cacheKey);
            const tags = uniqueTags(tagsForRow(row).concat(autoTagsForRow(row)));
            if (cacheKey) rowTagCache.set(cacheKey, tags);
            return tags;
        }

        function uniqueTags(tags) {
            const seen = new Set();
            return tags.filter(tag => {
                const key = String(tag || '').trim();
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function getFilteredData() {
            if (selectedTags.length === 0) return fullData;
            return fullData.filter(row => {
                const rowTags = allTagsForRow(row);
                return selectedTags.every(tag => rowTags.includes(tag));
            });
        }

        function groupTags(tags) {
            return tags.reduce((groups, tag) => {
                const group = tagCategoryId(tag);
                if (!groups[group]) groups[group] = [];
                groups[group].push(tag);
                return groups;
            }, {});
        }

        function tagCategoryId(tag) {
            const tagName = String(tag || '').trim();
            return tagCategoryConfig.assignments[tagName] || 'other';
        }

        function tagColor(tag) {
            const palette = [
                { bg: 'rgba(236, 253, 245, 0.70)', activeBg: 'rgba(209, 250, 229, 0.92)', text: '#047857', border: 'rgba(167, 243, 208, 0.95)' },
                { bg: 'rgba(255, 247, 237, 0.72)', activeBg: 'rgba(255, 237, 213, 0.94)', text: '#c2410c', border: 'rgba(254, 215, 170, 0.95)' },
                { bg: 'rgba(239, 246, 255, 0.72)', activeBg: 'rgba(219, 234, 254, 0.94)', text: '#1d4ed8', border: 'rgba(191, 219, 254, 0.95)' },
                { bg: 'rgba(245, 243, 255, 0.72)', activeBg: 'rgba(237, 233, 254, 0.94)', text: '#6d28d9', border: 'rgba(221, 214, 254, 0.95)' },
                { bg: 'rgba(240, 253, 250, 0.72)', activeBg: 'rgba(204, 251, 241, 0.94)', text: '#0f766e', border: 'rgba(153, 246, 228, 0.95)' }
            ];
            const other = { bg: 'rgba(253, 242, 248, 0.70)', activeBg: 'rgba(252, 231, 243, 0.92)', text: '#be185d', border: 'rgba(251, 207, 232, 0.95)' };
            const categoryId = tagCategoryId(tag);
            if (categoryId === 'other') return other;
            const index = Math.max(0, tagCategoryConfig.categories.findIndex(category => category.id === categoryId));
            return palette[index % palette.length] || other;
        }

        function tagFilterSkinStyle(tag) {
            const categoryId = tagCategoryId(tag);
            const activeCategoryId = tagCategoryConfig.activeSkinCategory || 'other';
            if (categoryId !== activeCategoryId) return null;
            const skin = tagCategoryConfig.skins && tagCategoryConfig.skins[activeCategoryId] && tagCategoryConfig.skins[activeCategoryId][tag];
            return skin || null;
        }

        function renderTagChip(tag, isManual = true) {
            const color = tagColor(tag);
            const className = 'tag-chip' + (isManual ? '' : ' auto-tag');
            return `<span class="${className}" style="background:${color.bg}; color:${color.text}; border:1px solid ${color.border};">${sanitizeHTML(tag)}</span>`;
        }

        function tagSkinForRow(row) {
            const cacheKey = row && row.__rowId ? row.__rowId : getLegacyRowKey(row || {});
            if (cacheKey && rowSkinCache.has(cacheKey)) return rowSkinCache.get(cacheKey);
            const tags = allTagsForRow(row);
            const categoryLabels = new Map((tagCategoryConfig.categories || []).map(category => [category.id, tagCategoryLabel(category)]));
            const categoryId = tagCategoryConfig.activeSkinCategory || 'other';
            const categorySkins = tagCategoryConfig.skins && tagCategoryConfig.skins[categoryId] ? tagCategoryConfig.skins[categoryId] : {};
            const tag = tags.find(item => categorySkins[item]);
            if (!tag) {
                if (cacheKey) rowSkinCache.set(cacheKey, null);
                return null;
            }
            const skin = {
                tag,
                categoryId,
                categoryLabel: categoryLabels.get(categoryId) || categoryId,
                skin: categorySkins[tag]
            };
            if (cacheKey) rowSkinCache.set(cacheKey, skin);
            return skin;
        }

        function getLegacyRowKey(row) {
            return [
                row['組織名'] || '',
                row['構築環境名'] || '',
                row['URL'] || '',
                row['ログインID'] || ''
            ].map(value => String(value).trim()).join('||');
        }

        function getOrgGroup(row) {
            const cacheKey = row && row.__rowId ? row.__rowId : getLegacyRowKey(row || {});
            if (cacheKey && orgGroupCache.has(cacheKey)) return orgGroupCache.get(cacheKey);
            const code = (row['組織コード'] || '').trim();
            const name = (row['組織名'] || '').trim();
            const isUnset = code === '' && name === '';
            const displayName = name || t('unset.name');
            const group = {
                key: isUnset ? '__unset__' : orgKeyFromParts(code, name),
                code,
                name: isUnset ? t('unset.org') : displayName,
                label: isUnset ? t('unset.org') : (code ? `${code} ${displayName}` : displayName),
                isUnset
            };
            if (cacheKey) orgGroupCache.set(cacheKey, group);
            return group;
        }

        function escapeJs(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        // --- RDP追加機能用関数 ---
        function getEndpoint(str) {
            if (!str) return { host: '', port: '' };
            const value = String(str).trim();
            try {
                if (value.includes('://')) {
                    const url = new URL(value);
                    return { host: url.hostname, port: url.port };
                }
                const firstPart = value.split('/')[0];
                const portMatch = firstPart.match(/^(.+):(\d+)$/);
                if (portMatch) return { host: portMatch[1].trim(), port: portMatch[2] };
                return { host: firstPart.trim(), port: '' };
            } catch (e) {
                const firstPart = value.split('/')[0];
                const portMatch = firstPart.match(/^(.+):(\d+)$/);
                if (portMatch) return { host: portMatch[1].trim(), port: portMatch[2] };
                return { host: firstPart.split(':')[0].trim(), port: '' };
            }
        }

        function getHost(str) {
            return getEndpoint(str).host;
        }

        function sameEndpoint(left, right) {
            return left.host && right.host && left.host === right.host && left.port === right.port;
        }

        function findRemotesByHost(host) {
            const normalizedHost = String(host || '').trim();
            if (!normalizedHost) return [];
            return rdpHostIndex.get(normalizedHost) || [];
        }

        function findRemotesByEndpoint(endpoint) {
            if (!endpoint || !endpoint.host || !endpoint.port) return [];
            return rdpEndpointIndex.get(`${endpoint.host}:${endpoint.port}`) || [];
        }

        function openPwdModal() {
            document.getElementById('pwdModal').style.display = 'flex';
            document.getElementById('modalPwdInput').focus();
        }

        function closePwdModal() {
            document.getElementById('pwdModal').style.display = 'none';
            document.getElementById('modalPwdInput').value = '';
        }

        function submitPwdModal() {
            const pwd = document.getElementById('modalPwdInput').value;
            if (!pwd) return;

            portalFetch('auth.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'pwd=' + encodeURIComponent(pwd)
            })
            .then(res => res.text())
            .then(txt => {
                if (txt.trim() === "OK") {
                    localStorage.setItem('authExpiry', new Date().getTime() + 15 * 60 * 1000);
                    isAuthenticated = true;
                    closePwdModal();
                    showToast(t('toast.rdpAuthOk'));
                    // 現在の表示を更新
                    const currentOrg = document.getElementById('orgSelect').value;
                    if (currentOrg) renderEnvironments(currentOrg);
                    else renderInitialSummary();
                } else {
                    alert(t('error.authWrong'));
                    document.getElementById('modalPwdInput').value = '';
                    document.getElementById('modalPwdInput').focus();
                }
            })
            .catch(err => {
                console.error(err);
                alert(t('error.auth'));
            });
        }

        function copyText(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(t('toast.copied') + ': ' + text);
                }).catch(err => {
                    console.error('コピー失敗:', err);
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }

        function fallbackCopyText(text) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; 
                textArea.style.top = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand("copy");
                document.body.removeChild(textArea);
                if (successful) {
                    showToast(t('toast.copied') + ': ' + text);
                } else {
                    showToast(t('error.network'));
                }
            } catch (err) {
                console.error('Fallbackコピー失敗:', err);
                showToast(t('error.network'));
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
