<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvPortal - 環境検索</title>
    <link rel="stylesheet" href="style.css">
    <script src="vendor/papaparse.min.js"></script>
    <script src="i18n.js?v=2.3.22"></script>
    <script src="org_readings.js"></script>
    <style>
        .org-summary-card {
            background: linear-gradient(180deg, #ffffff 0%, #f7fcfd 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.15rem 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .org-summary-card:hover {
            box-shadow: 0 10px 28px rgba(13,55,74,0.1);
            border-color: var(--primary);
        }
        .org-name-header {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            padding: 0.2rem 0 0.2rem 0.8rem;
            display: flex;
            align-items: center;
            min-height: 36px;
            min-width: 0;
            border-left: 6px solid var(--primary);
        }
        .org-summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.9rem;
            padding: 0.15rem 0.35rem 0.55rem 0;
        }
        .org-name-header-main {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .org-level-actions,
        .group-level-actions {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            flex: 0 0 auto;
        }
        .org-level-actions button,
        .group-level-actions button {
            min-height: 28px;
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
            font-size: 0.78rem;
            line-height: 1.2;
            font-weight: 700;
        }
        .org-level-actions button:not(.env-add-btn):not(.org-add-btn),
        .group-level-actions button:not(.env-add-btn):not(.org-add-btn) {
            width: 30px;
            height: 30px;
            min-height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .org-level-actions svg,
        .group-level-actions svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            display: block;
        }
        .org-list-toolbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.85rem;
            box-shadow: var(--shadow-card);
        }
        .org-list-toolbar-title {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1rem;
        }
        .org-name-header:hover {
            color: var(--primary-hover);
        }
        .env-card[data-skin="1"] {
            background: var(--env-skin-bg) !important;
            border-color: var(--env-skin-border) !important;
            box-shadow: inset 3px 0 0 var(--env-skin-accent), var(--shadow-card) !important;
        }
        .env-card[data-skin="1"] .env-card-title-wrap {
            border-bottom-color: var(--env-skin-border) !important;
        }
        .env-card[data-skin="1"] .env-card-title-main {
            color: var(--env-skin-accent) !important;
        }
        .env-card[data-skin="1"] .info-subcard {
            background: linear-gradient(rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.74)), var(--env-skin-bg) !important;
            border-color: var(--env-skin-border) !important;
        }
        .org-code {
            color: #9bb2bd;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: "Segoe UI Semibold", "Arial", "Meiryo UI", sans-serif;
            margin-left: 0.5rem;
            letter-spacing: 0;
        }
        .org-badges-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
            gap: 0.9rem;
            align-items: start;
        }
        .env-flow-item {
            min-width: 0;
            transition: grid-column 0.42s ease;
        }
        .env-flow-item.expanded {
            grid-column: auto;
        }
        .env-flow-item.expanded .env-card {
            max-width: none;
            min-width: 0;
            width: 100%;
            box-shadow: none;
            border-color: #b8e2ea;
            animation: inlineCardIn 0.52s ease both;
        }
        @media (max-width: 900px) {
            .org-badges-wrapper {
                grid-template-columns: 1fr;
            }
            .env-flow-item.expanded {
                grid-column: auto;
            }
            .env-flow-item.expanded .env-card {
                max-width: none;
            }
        }
        .env-badge {
            display: block;
            background: linear-gradient(180deg, #ffffff 0%, #f6fcfd 100%);
            color: var(--text-main);
            padding: 0.65rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            min-height: 88px;
            transition: opacity 0.42s ease, max-height 0.42s ease, padding 0.42s ease, border-width 0.42s ease, transform 0.42s ease, box-shadow 0.22s ease, background 0.22s ease, border-color 0.22s ease;
            min-width: 0;
        }
        .env-badge:hover {
            border-color: var(--primary);
            background: #ecf9fb;
            box-shadow: 0 6px 18px rgba(8,126,164,0.1);
            transform: translateY(-1px);
        }
        .env-summary-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            min-width: 0;
        }
        .env-summary-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
            color: var(--text-main);
        }
        .env-summary-meta {
            color: #6b7f8f;
            font-size: 0.72rem;
            white-space: nowrap;
        }
        .env-summary-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            margin-left: auto;
            flex: 0 0 auto;
        }
        .env-summary-title {
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .env-expand-btn,
        .env-collapse-btn {
            width: 30px;
            height: 28px;
            border: 1px solid #b8dbe6;
            border-radius: 6px;
            background: #fff;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.18s ease;
            flex: 0 0 auto;
        }
        .env-expand-btn:hover,
        .env-collapse-btn:hover {
            border-color: var(--primary);
            background: #e9f8fb;
            transform: translateY(-1px);
        }
        .env-collapse-btn {
            margin-left: 0;
        }
        .env-flow-item.expanded .env-card-title-wrap {
            position: relative;
        }
        .env-flow-item.expanded .env-card-title-wrap .env-collapse-btn {
            position: static;
        }
        .env-summary-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.28rem;
            margin-top: 0.42rem;
        }
        .env-summary-tags .tag-chip {
            margin: 0;
            font-size: 0.68rem;
            padding: 0.08rem 0.38rem;
        }
        .env-summary-url {
            margin-top: 0.35rem;
            color: #6b7f8f;
            font-size: 0.72rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        @keyframes inlineCardIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .home-container {
            width: calc(100% - 2rem);
            margin: 0 auto;
            padding: 0 0 2rem;
        }
        .home-layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 1rem;
            align-items: start;
        }
        .side-filter-stack {
            position: sticky;
            top: 0.75rem;
            max-height: calc(100vh - 1.5rem);
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            overflow: hidden;
        }
        .org-filter-card,
        .tag-filter-card {
            padding: 0.95rem 0.65rem 0.65rem;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .org-filter-card {
            flex: 0 0 auto;
            max-height: 44vh;
            min-height: 0;
        }
        .tag-filter-card {
            flex: 1 1 auto;
            min-height: 0;
        }
        .org-filter-menu {
            min-height: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .org-filter-menu summary {
            list-style: none;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.98rem;
            font-weight: 700;
            padding: 0 0.35rem 0.65rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .org-filter-summary-title {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .org-add-btn,
        .env-add-btn {
            min-height: 28px;
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
            background: #ffffff !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            font-size: 0.78rem;
            line-height: 1.2;
            font-weight: 700;
            box-shadow: none;
            transform: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .org-filter-menu summary::-webkit-details-marker {
            display: none;
        }
        .org-filter-menu summary::after {
            content: "";
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 7px solid #94a3b8;
        }
        .org-filter-menu:not([open]) summary::after {
            transform: rotate(180deg);
        }
        .org-filter-body {
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            flex: 1 1 auto;
        }
        .org-filter-search {
            margin: 0 0.35rem;
            width: calc(100% - 0.7rem);
            min-height: 34px;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0.42rem 0.55rem;
            background: #fff;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .org-filter-list {
            overflow-y: auto;
            padding: 0 0.2rem 0 0.35rem;
            scrollbar-width: thin;
            min-height: 0;
            max-height: 32vh;
        }
        .org-filter-tabs {
            display: flex;
            gap: 0.25rem;
            overflow-x: auto;
            padding: 0 0.35rem 0.25rem;
            scrollbar-width: thin;
        }
        .org-filter-tab {
            min-width: 34px;
            min-height: 28px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: #64748b;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            white-space: nowrap;
        }
        .org-filter-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .org-filter-tab.active {
            background: #111;
            border-color: #111;
            color: #fff;
        }
        .org-filter-group-items {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding-left: 0.1rem;
        }
        .org-filter-btn {
            width: 100%;
            border: 0;
            background: transparent;
            border-radius: 3px;
            padding: 0.34rem 0.2rem;
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr) auto;
            gap: 0.45rem;
            align-items: center;
            text-align: left;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.85rem;
        }
        .org-filter-btn:hover,
        .org-filter-btn.active {
            background: #f8fafc;
        }
        .org-filter-btn.active {
            color: var(--primary);
            font-weight: 700;
        }
        .org-filter-check {
            width: 19px;
            height: 19px;
            border: 2px solid #cbd5df;
            border-radius: 3px;
            background: #f8fbfc;
            display: inline-block;
            position: relative;
        }
        .org-filter-btn.active .org-filter-check {
            border-color: var(--primary);
            background: #fff;
        }
        .org-filter-btn.active .org-filter-check::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 1px;
            background: var(--primary);
        }
        .org-filter-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .org-filter-code {
            color: #8aa6bf;
            font-size: 0.72rem;
            white-space: nowrap;
        }
        @media (max-width: 1100px) {
            .home-container {
                width: calc(100% - 1rem);
            }
            .home-layout {
                grid-template-columns: 1fr;
            }
            .side-filter-stack {
                position: static;
                max-height: none;
            }
            .org-filter-card,
            .tag-filter-card {
                position: static;
                max-height: none;
            }
        }
        .tag-filter-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.65rem;
            padding: 0 0.35rem;
        }
        .tag-filter-title label {
            color: var(--text-main);
            font-size: 0.98rem;
            font-weight: 700;
        }
        .tag-filter-hint {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 7px solid #94a3b8;
            overflow: hidden;
            color: transparent;
            flex: 0 0 auto;
        }
        .tag-chip {
            display: inline-block;
            border-radius: 4px;
            padding: 0.15rem 0.45rem;
            font-size: 0.72rem;
            font-weight: 500;
            margin-left: 0.35rem;
            margin-bottom: 0.25rem;
        }
        .tag-chip.auto-tag {
            font-weight: 700;
            border-style: solid;
        }
        .env-card-title-wrap {
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.65rem;
            margin-bottom: 0.85rem;
        }
        .env-card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }
        .env-card-title-main {
            min-width: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
        }
        .env-card-action-area {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-left: auto;
            flex: 0 0 auto;
            align-self: flex-start;
        }
        .env-card-status-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.35rem;
            padding-left: 23px;
        }
        .env-card-tag-row {
            margin-top: 0.5rem;
            padding-left: 23px;
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .env-card-tag-row .tag-chip {
            margin: 0;
        }
        .db-title-tags {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .db-title-tags .tag-chip {
            margin: 0;
        }
        .tag-filter-panel {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-height: 38px;
            overflow-y: auto;
            padding: 0 0.2rem 0 0.35rem;
            scrollbar-width: thin;
        }
        .tag-filter-group {
            width: 100%;
            display: block;
        }
        .tag-filter-group + .tag-filter-group {
            margin-top: 0;
        }
        .tag-filter-group-label {
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.4;
            white-space: nowrap;
            margin: 0.65rem 0 0.25rem;
        }
        .tag-filter-group-items {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-width: 0;
        }
        .tag-filter-btn {
            width: 100%;
            border: 0;
            border-radius: 2px;
            padding: 0.32rem 0.15rem;
            font-size: 0.86rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-main);
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.45rem;
            text-align: left;
        }
        .tag-filter-btn:hover {
            background: #f8fafc;
        }
        .tag-filter-btn[data-skin="1"] {
            background: var(--tag-filter-skin-bg);
            border: 1px solid var(--tag-filter-skin-border);
            color: var(--tag-filter-skin-accent);
        }
        .tag-filter-btn[data-skin="1"]:hover {
            background: linear-gradient(rgba(255,255,255,0.32), rgba(255,255,255,0.32)), var(--tag-filter-skin-bg);
            border-color: var(--tag-filter-skin-accent);
        }
        .tag-filter-btn.active {
            color: #00b050;
            font-weight: 500;
        }
        .tag-filter-btn[data-skin="1"].active {
            color: var(--tag-filter-skin-accent);
            background: linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.18)), var(--tag-filter-skin-bg);
            border-color: var(--tag-filter-skin-accent);
        }
        .tag-filter-check {
            width: 19px;
            height: 19px;
            border: 2px solid #cbd5df;
            border-radius: 3px;
            background: #f8fbfc;
            display: inline-block;
            position: relative;
        }
        .tag-filter-btn.active .tag-filter-check {
            border-color: #00b050;
            background: #fff;
        }
        .tag-filter-btn[data-skin="1"] .tag-filter-check {
            border-color: var(--tag-filter-skin-border);
            background: rgba(255,255,255,0.72);
        }
        .tag-filter-btn[data-skin="1"].active .tag-filter-check {
            border-color: var(--tag-filter-skin-accent);
        }
        .tag-filter-btn.active .tag-filter-check::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 1px;
            background: #00b050;
        }
        .tag-filter-btn[data-skin="1"].active .tag-filter-check::after {
            background: var(--tag-filter-skin-accent);
        }
        .tag-filter-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tag-filter-count {
            color: #8aa6bf;
            font-size: 0.74rem;
            white-space: nowrap;
        }
        .tag-filter-btn.active .tag-filter-count {
            color: #6aa878;
        }
        .tag-clear-btn {
            width: 100%;
            border: 1px solid #1683ff;
            background: #fff;
            color: #1683ff;
            border-radius: 2px;
            padding: 0.62rem 0.7rem;
            cursor: pointer;
            margin-top: 0.6rem;
            font-size: 0.9rem;
        }
        @media (max-width: 640px) {
            .tag-filter-group {
                grid-template-columns: 1fr;
                gap: 0.25rem;
            }
            .tag-filter-group-label {
                line-height: 1.4;
            }
        }
        .tag-empty {
            color: var(--text-muted);
            line-height: 1.5;
            padding: 0.5rem 0.35rem;
        }
        @media (max-width: 860px) {
            .main-nav-inner {
                flex-wrap: wrap;
                gap: 0.75rem;
                padding-bottom: 0.75rem;
            }
        }
        .env-org-title {
            display: block;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: normal;
            margin-top: 0.25rem;
            padding-left: 23px;
        }
        .active-org-banner {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, #ffffff 0%, #f7fcfd 100%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.25rem;
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .active-org-name {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 700;
            border-left: 5px solid var(--primary);
            padding-left: 0.75rem;
        }
        .active-org-code {
            color: #9bb2bd;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: "Segoe UI Semibold", "Arial", "Meiryo UI", sans-serif;
        }
        .tag-org-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .tag-org-section .active-org-banner {
            margin-bottom: -0.25rem;
        }
        .env-status-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0 0 0.9rem;
        }
        .env-status-meta span {
            background: #f5fbfc;
            border: 1px solid #d7e6ee;
            color: #627987;
            border-radius: 4px;
            padding: 0.15rem 0.45rem;
            font-size: 0.72rem;
            font-weight: 500;
        }
        .info-subcard {
            background: linear-gradient(180deg, #f3fbfd 0%, #ffffff 100%);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid #b8e2ea;
            margin-top: 1rem;
            min-width: 0;
        }
        .db-remote-section {
            border-top: 1px solid #b8e2ea;
            margin-top: 0.85rem;
            padding-top: 0.85rem;
            min-width: 0;
        }
        .db-section-title {
            color: var(--primary);
            font-weight: bold;

        /* Base UI inspired redesign overrides */

        .info-subcard {
            background: #ffffff !important;
            border-color: var(--border) !important;

        .org-summary-card:hover,

        .active-org-code {

        .icon-btn {
            border-color: var(--border) !important;

        .icon-btn:hover:not(:disabled) {

        .card-edit-actions {

        .card-edit-actions .secondary-btn,
        .card-edit-actions .primary-btn,

        .card-edit-actions svg,

</head>
<body data-title-key="app.searchTitle">
    <header class="top-header">
        <div class="logo-area">
            <h1>Env<span>Portal</span></h1>
            <p data-i18n="header.searchDesc">特定の組織の各種テストおよび本番環境のログイン情報をすばやく検索</p>
        </div>
        <nav class="main-nav">
            <div class="main-nav-inner">
                <a href="index.html" class="active" data-i18n="nav.search">環境検索</a>
                <a id="productionNavLink" href="production.html" data-i18n="nav.production" onclick="syncProductionNavLink()">本番環境</a>
            </div>
        </nav>
    </header>

    <select id="orgSelect" hidden aria-hidden="true">
        <option value="">-- データ読み込み中... --</option>
    </select>

    <div class="container home-container">
        <div class="home-layout">
            <div class="side-filter-stack">
                <div class="card org-filter-card">
                    <details id="orgFilterMenu" class="org-filter-menu" open>
                        <summary>
                            <span class="org-filter-summary-title" data-i18n="label.orgSelect">組織選択</span>
                        </summary>
                        <div class="org-filter-body">
                            <input id="orgFilterSearch" class="org-filter-search" type="search" data-i18n-placeholder="label.orgName" placeholder="" oninput="renderOrgFilterMenu()">
                            <div id="orgFilterList" class="org-filter-list"></div>
                        </div>
                    </details>
                </div>
                <div class="card tag-filter-card">
                    <div class="tag-filter-title">
                        <label data-i18n="label.tags">タグ</label>
                        <span class="tag-filter-hint" data-i18n="filter.tagsHint">複数選択で AND 条件</span>
                    </div>
                    <div id="tagFilterPanel" class="tag-filter-panel"></div>
                </div>
            </div>

            <div style="min-width:0;">
                <div id="resultsArea" class="env-grid">
                <div style="grid-column: 1 / -1;" class="empty-state">
                    <span data-i18n="state.loading">データ読み込み中...</span>
                </div>
                </div>
            </div>
        </div>
    </div>

    <!-- パスワード モーダル -->
    <div id="pwdModal" style="display:none;">
        <div class="modal-content">
            <h3 data-i18n="modal.rdpUnlockTitle">サーバ接続情報 解除</h3>
            <p data-i18n="modal.rdpUnlockDesc">サーバ接続情報を表示するにはパスワードを入力してください</p>
            <input type="password" id="modalPwdInput" onkeypress="if(event.key==='Enter') submitPwdModal()">
            <div class="modal-btns">
                <button type="button" class="secondary-btn" onclick="closePwdModal()" data-i18n="button.cancel">キャンセル</button>
                <button type="button" class="primary-btn" onclick="submitPwdModal()" data-i18n="button.unlock">解除</button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示 -->
    <div id="toast" data-i18n="toast.copied">コピーしました</div>

    <div id="remoteLoadingOverlay" class="remote-loading-overlay" aria-live="polite" aria-busy="true">
        <div class="remote-loading-dialog">
            <div class="remote-loading-spinner"></div>
            <div class="remote-loading-title" data-i18n="remote.loadingTitle">遠隔操作を準備中...</div>
            <div class="remote-loading-message" data-i18n="remote.loadingMessage">接続画面が開くまでお待ちください</div>
        </div>
    </div>

    <div id="addModal" class="add-modal">
        <div class="add-modal-content">
            <h3 id="addModalTitle" data-i18n="modal.add">追加</h3>
            <div id="addModalFields" class="add-modal-grid"></div>
            <div class="add-modal-actions">
                <button type="button" class="secondary-btn" onclick="closeAddModal()" data-i18n="button.cancel">キャンセル</button>
                <button id="addModalSubmitBtn" type="button" class="primary-btn" onclick="submitAddModal()" data-i18n="button.add">追加</button>
            </div>
        </div>
    </div>

    <script>
        let fullData = [];
        let rdpData = []; // RDP情報を保持
        let tagStore = {};
        let envGroupStore = { records: {} };
        let tagCategoryConfig = normalizeTagCategories(null);
        let portalConfig = {};
        let selectedTags = [];
        let isAuthenticated = false; // RDP表示の認証状態
        let canEdit = false;
        let canManageUsers = false;
        let editingEnvId = '';
        let selectedOrgKanaTab = '';
        let addModalContext = null;
        let currentOrgPage = 1;
        let statusRefreshTimer = null;
        let statusQueue = [];
        let registeredStatusCards = [];
        let activeStatusChecks = 0;
        let renderToken = 0;
        let portalDataLevel = 0;
        let portalConfigPromise = null;
        let portalConfigFollowupTimer = null;
        let secondaryPanelTimer = null;
        let rowTagCache = new Map();
        let rowSkinCache = new Map();
        let orgGroupCache = new Map();
        let rdpHostIndex = new Map();
        let rdpEndpointIndex = new Map();
        const ORGS_PER_PAGE = 6;
        const STATUS_REFRESH_MS = 60000;
        const STATUS_CHECK_CONCURRENCY = 1;
        const RENDER_BATCH_SIZE = 12;
        const DEFAULT_ENV_GROUP = 'デフォルト';
        const ENV_GROUP_OPTIONS = [DEFAULT_ENV_GROUP, 'UHR-V6', 'PHR-V7', 'UPDS-V6', 'UPDS-V7'];
        const DATA_FIELDS = ["組織コード","組織名","環境グループ","構築環境名","URL","ログインID","ログインパスワード","DBタイプ","DBバージョン","DB名","DBユーザー名","DBパスワード"];
        const RDP_FIELDS = ["組織名","接続タイプ","RDPユーザー名","RDPパスワード","接続先(IP:Port)"];
        const AUTO_TAG_PROVIDERS = [
            autoEnvTagsForRow,
            autoDbTagsForRow,
            autoRemoteTagsForRow
        ];
        window.addEventListener('DOMContentLoaded', () => {
            const orgSelect = document.getElementById('orgSelect');
            
            // 認証状態の確認
            const expiry = localStorage.getItem('authExpiry');
            if (expiry && new Date().getTime() < parseInt(expiry)) {
                isAuthenticated = true;
            }
            loadPortalData({ authenticated: false });
            loadPortalConfig().then(() => checkWindowsAuth({ allowProxy: false }));
        });

        function resetPortalDerivedCaches() {
            rowTagCache = new Map();
            rowSkinCache = new Map();
            orgGroupCache = new Map();
            buildRemoteIndexes();
        }

        function buildRemoteIndexes() {
            rdpHostIndex = new Map();
            rdpEndpointIndex = new Map();
            rdpData.forEach(remote => {
                const endpoint = getEndpoint(remote['接続先(IP:Port)']);
                if (endpoint.host) {
                    if (!rdpHostIndex.has(endpoint.host)) rdpHostIndex.set(endpoint.host, []);
                    rdpHostIndex.get(endpoint.host).push(remote);
                }
                if (endpoint.host && endpoint.port) {
                    const key = `${endpoint.host}:${endpoint.port}`;
                    if (!rdpEndpointIndex.has(key)) rdpEndpointIndex.set(key, []);
                    rdpEndpointIndex.get(key).push(remote);
                }
            });
        }

        function scheduleSecondaryPanelRender() {
            if (secondaryPanelTimer) clearTimeout(secondaryPanelTimer);
            const run = () => {
                secondaryPanelTimer = null;
                renderOrgFilterMenu();
                renderTagFilters();
            };
            secondaryPanelTimer = setTimeout(run, 0);
        }

        function loadPortalData(options = {}) {
            const authenticated = Boolean(options.authenticated);
            const level = authenticated ? 2 : 1;
            const request = authenticated
                ? portalFetch('portal_data.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                : fetch('portal_data.jsp?t=' + new Date().getTime(), { cache: 'no-store' });
            return request
                .then(res => res.ok ? res.json() : Promise.reject(new Error('portal_data load failed')))
                .then(payload => applyPortalPayload(payload, level))
                .catch(error => {
                    console.error('データの取得に失敗しました:', error);
                    orgSelect.innerHTML = `<option value="">${t('select.loadFailed')}</option>`;
                    orgSelect.disabled = true;
                });
        }

        function applyPortalPayload(payload, level) {
            if (level < portalDataLevel) return payload;
            portalDataLevel = level;
            canEdit = Boolean(payload && (payload.canEditPortal || payload.canEdit));
            canManageUsers = Boolean(payload && payload.canManageUsers);
            setCurrentUser(payload);
            setSystemMenuVisible(isSystemAdmin(payload));
            isAuthenticated = canEdit;
            tagStore = normalizeTagStore(payload.tags || {});
            envGroupStore = normalizeEnvGroupStore(payload.envGroups || {});
            tagCategoryConfig = normalizeTagCategories(payload.tagCategories || {});
            fullData = assignRowIds(payload.data || [], 'env');
            rdpData = assignRowIds(payload.rdp || [], 'rdp');
            syncEnvGroupsFromData();
            resetPortalDerivedCaches();
            updateEditToolbar();

            initDropdown();
            renderInitialSummary();
            scheduleSecondaryPanelRender();
            loadPortalConfig();
            syncOrgReadingsAndRefresh();
            return payload;
        }

        function loadPortalConfig() {
            if (portalConfigPromise) return portalConfigPromise;
            portalConfigPromise = fetch('portal_config.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : {})
                .then(configJson => {
                    portalConfig = configJson || {};
                    const currentOrg = document.getElementById('orgSelect').value;
                    if (currentOrg) renderEnvironments(currentOrg);
                    schedulePortalConfigFollowup();
                    return portalConfig;
                })
                .catch(() => {
                    portalConfig = {};
                    return portalConfig;
                })
                .finally(() => {
                    portalConfigPromise = null;
                });
            return portalConfigPromise;
        }

        function schedulePortalConfigFollowup() {
            if (!portalConfig.guacamoleEnabled || portalConfig.guacamoleStatus !== 'not checked') return;
            if (portalConfigFollowupTimer) return;
            portalConfigFollowupTimer = setTimeout(() => {
                portalConfigFollowupTimer = null;
                loadPortalConfig();
            }, 2000);
        }

        function checkWindowsAuth(options = {}) {
            portalFetch('auth_windows.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : { ok: false })
                .then(result => {
                    canEdit = Boolean(result && (result.canEditPortal || result.canEdit));
                    canManageUsers = Boolean(result && result.canManageUsers);
                    setCurrentUser(result);
                    setSystemMenuVisible(isSystemAdmin(result));
                    updateEditToolbar();
                    if (!result || !result.ok) {
                        isAuthenticated = false;
                        localStorage.removeItem('authExpiry');
                        renderActiveView();
                        return;
                    }
                    isAuthenticated = true;
                    localStorage.setItem('authExpiry', new Date().getTime() + 15 * 60 * 1000);
                    closePwdModal();
                    if (result.canEdit || result.canManageUsers) {
                        loadPortalData({ authenticated: true });
                    } else {
                        renderActiveView();
                    }
                })
                .catch(() => {
                    canEdit = false;
                    canManageUsers = false;
                    isAuthenticated = false;
                    setCurrentUser(null);
                    setSystemMenuVisible(false);
                    localStorage.removeItem('authExpiry');
                    updateEditToolbar();
                });
        }

        function assignRowIds(rows, prefix) {
            return rows.map((row, index) => ({ ...row, __rowId: row.__rowId || `${prefix}_${Date.now()}_${index}_${Math.random().toString(36).slice(2)}` }));
        }

        function updateEditToolbar() {
            syncProductionNavLink();
        }

        function syncProductionNavLink() {
            const link = document.getElementById('productionNavLink');
            if (!link) return;
            const orgName = selectedOrgNameForProduction();
            link.href = orgName ? `production.html?org=${encodeURIComponent(orgName)}` : 'production.html';
        }

        function selectedOrgNameForProduction() {
            const orgKey = document.getElementById('orgSelect').value;
            if (!orgKey) return '';
            const org = getOrgOptions().find(item => item.key === orgKey);
            return org ? org.name : '';
        }

        window.addEventListener('i18n:changed', () => {
            const currentOrg = document.getElementById('orgSelect').value;
            initDropdown();
            if (currentOrg && Array.from(document.getElementById('orgSelect').options).some(opt => opt.value === currentOrg)) {
                document.getElementById('orgSelect').value = currentOrg;
            }
            renderOrgFilterMenu();
            renderTagFilters();
            renderActiveView();
        });

        function initDropdown() {
            const orgSelect = document.getElementById('orgSelect');

            orgSelect.innerHTML = `<option value="">${t('select.allOrgSummary')}</option>`;
            
            const sortedOrgs = getOrgOptions();
            
            sortedOrgs.forEach(org => {
                const opt = document.createElement('option');
                opt.value = org.key;
                opt.textContent = org.label;
                orgSelect.appendChild(opt);
            });

            orgSelect.addEventListener('change', (e) => {
                currentOrgPage = 1;
                renderOrgFilterMenu();
                syncProductionNavLink();
                renderActiveView();
            });
        }

        function renderOrgFilterMenu() {
            const list = document.getElementById('orgFilterList');
            if (!list) return;
            const searchInput = document.getElementById('orgFilterSearch');
            const keyword = (searchInput ? searchInput.value : '').trim().toLowerCase();
            const currentOrg = document.getElementById('orgSelect').value;
            const orgs = getOrgOptions().filter(org => {
                if (!keyword) return true;
                return `${org.name} ${org.code} ${org.label}`.toLowerCase().includes(keyword);
            });

            list.innerHTML = '';
            if (orgs.length === 0) {
                list.innerHTML = `<div class="tag-empty">${t('state.noMatchedOrg')}</div>`;
                return;
            }

            const grouped = groupOrgsByKana(orgs);
            const currentOrgInfo = currentOrg ? orgs.find(org => org.key === currentOrg) : null;
            const currentOrgKana = currentOrgInfo ? kanaGroupForName(currentOrgInfo.name) : '';
            const availableLabels = new Set(grouped.map(group => group.label));
            if (currentOrgKana && availableLabels.has(currentOrgKana)) selectedOrgKanaTab = currentOrgKana;
            if (!selectedOrgKanaTab || !availableLabels.has(selectedOrgKanaTab)) selectedOrgKanaTab = grouped[0].label;

            const tabs = document.createElement('div');
            tabs.className = 'org-filter-tabs';
            grouped.forEach(group => {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'org-filter-tab' + (group.label === selectedOrgKanaTab ? ' active' : '');
                tab.textContent = group.label;
                tab.title = group.label;
                tab.onclick = () => {
                    selectedOrgKanaTab = group.label;
                    renderOrgFilterMenu();
                };
                tabs.appendChild(tab);
            });
            list.appendChild(tabs);

            const activeGroup = grouped.find(group => group.label === selectedOrgKanaTab) || grouped[0];
            const items = document.createElement('div');
            items.className = 'org-filter-group-items';
            activeGroup.items.forEach(org => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'org-filter-btn' + (currentOrg === org.key ? ' active' : '');
                btn.title = org.label;
                btn.innerHTML = `
                    <span class="org-filter-check" aria-hidden="true"></span>
                    <span class="org-filter-name">${sanitizeHTML(org.label)}</span>
                `;
                btn.onclick = () => selectOrgFromMenu(org.key);
                items.appendChild(btn);
            });
            list.appendChild(items);
        }

        function getOrgOptions() {
            const orgMap = new Map();
            fullData.forEach(item => {
                const group = getOrgGroup(item);
                if (!group.isUnset && !orgMap.has(group.key)) orgMap.set(group.key, group);
            });
            Object.values(envGroupStore.records || {}).forEach(record => {
                const org = orgInfoFromGroupRecord(record);
                if (!org.isUnset && !orgMap.has(org.key)) orgMap.set(org.key, org);
            });
            return Array.from(orgMap.values()).sort((a, b) => a.label.localeCompare(b.label, 'ja'));
        }

        function orgInfoFromGroupRecord(record) {
            const code = String(record && record.code || '').trim();
            const name = String(record && record.name || '').trim();
            const key = String(record && record.key || orgKeyFromParts(code, name)).trim();
            const displayName = name || (key.startsWith('name:') ? key.slice(5) : key);
            const isUnset = key === '__unset__' || (!code && !displayName);
            return {
                key: isUnset ? '__unset__' : key,
                code,
                name: isUnset ? t('unset.org') : displayName,
                label: isUnset ? t('unset.org') : (code ? `${code} ${displayName}` : displayName),
                isUnset
            };
        }

        function syncOrgReadingsAndRefresh() {
            portalFetch('org_readings_status.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : Promise.reject(new Error('org readings load failed')))
                .then(payload => {
                    const overrides = { ...(window.ORG_READING_OVERRIDES || {}) };
                    (payload.records || []).forEach(record => {
                        if (record.name && record.reading) overrides[record.name] = record.reading;
                    });
                    window.ORG_READING_OVERRIDES = overrides;
                    renderOrgFilterMenu();
                })
                .catch(error => console.warn('org readings sync failed:', error));
        }

        function groupOrgsByKana(orgs) {
            const order = [
                'あ', 'い', 'う', 'え', 'お',
                'か', 'き', 'く', 'け', 'こ',
                'さ', 'し', 'す', 'せ', 'そ',
                'た', 'ち', 'つ', 'て', 'と',
                'な', 'に', 'ぬ', 'ね', 'の',
                'は', 'ひ', 'ふ', 'へ', 'ほ',
                'ま', 'み', 'む', 'め', 'も',
                'や', 'ゆ', 'よ',
                'ら', 'り', 'る', 'れ', 'ろ',
                'わ', 'を', 'ん',
                t('kana.other')
            ];
            const groups = new Map(order.map(label => [label, []]));
            orgs.forEach(org => {
                groups.get(kanaGroupForName(org.name)).push(org);
            });
            return order
                .map(label => ({ label, items: groups.get(label) || [] }))
                .filter(group => group.items.length > 0);
        }

        function kanaGroupForName(name) {
            const text = String(name || '').trim().normalize('NFKC');
            if (!text) return t('kana.other');
            const reading = (window.ORG_READING_OVERRIDES && window.ORG_READING_OVERRIDES[text]) || text;
            const first = toHiragana(String(reading).charAt(0));
            const normalized = normalizeKanaInitial(first);
            if (normalized) return normalized;
            return t('kana.other');
        }

        function normalizeKanaInitial(char) {
            const map = {
                'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お',
                'が': 'か', 'ぎ': 'き', 'ぐ': 'く', 'げ': 'け', 'ご': 'こ',
                'ざ': 'さ', 'じ': 'し', 'ず': 'す', 'ぜ': 'せ', 'ぞ': 'そ',
                'だ': 'た', 'ぢ': 'ち', 'づ': 'つ', 'で': 'て', 'ど': 'と',
                'っ': 'つ',
                'ば': 'は', 'び': 'ひ', 'ぶ': 'ふ', 'べ': 'へ', 'ぼ': 'ほ',
                'ぱ': 'は', 'ぴ': 'ひ', 'ぷ': 'ふ', 'ぺ': 'へ', 'ぽ': 'ほ',
                'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ'
            };
            if (map[char]) return map[char];
            if ('あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.includes(char)) return char;
            return '';
        }

        function toHiragana(char) {
            const code = char.charCodeAt(0);
            if (code >= 0x30A1 && code <= 0x30F6) {
                return String.fromCharCode(code - 0x60);
            }
            return char;
        }

        function selectOrgFromMenu(orgKey) {
            currentOrgPage = 1;
            const orgSelect = document.getElementById('orgSelect');
            if (orgSelect.value === orgKey) {
                orgSelect.value = '';
                renderOrgFilterMenu();
                syncProductionNavLink();
                renderActiveView();
                return;
            }
            orgSelect.value = orgKey;
            renderOrgFilterMenu();
            syncProductionNavLink();
            renderActiveView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addOrganization(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!canEdit) return;
            openAddModal('org', 'modal.orgAdd', [
                ['組織コード', ''],
                ['組織名', '', true],
            ]);
        }

        function groupNameOptions(orgKey = '') {
            return uniqueTags(ENV_GROUP_OPTIONS.concat(orgKey ? getEnvGroupsForOrg(orgKey) : fullData.map(row => envGroupValue(row))).filter(Boolean));
        }

        function getEnvGroupsForOrg(orgKey) {
            const record = envGroupStore.records[orgKey];
            const groups = record && Array.isArray(record.groups) ? record.groups.slice() : [];
            fullData.forEach(row => {
                if (getOrgGroup(row).key === orgKey) groups.push(envGroupValue(row));
            });
            return uniqueTags([DEFAULT_ENV_GROUP].concat(groups.map(normalizeGroupName)));
        }

        function addGroupNameToOrg(orgKey, groupName) {
            const org = getOrgOptions().find(item => item.key === orgKey);
            if (!org) return null;
            const record = ensureEnvGroupRecord(org);
            const normalized = normalizeGroupName(groupName);
            if (!record.groups.includes(normalized)) record.groups.push(normalized);
            return normalized;
        }

        function renameEnvGroupInStore(orgKey, beforeGroup, afterGroup) {
            const record = envGroupStore.records[orgKey];
            if (!record) return;
            const from = normalizeGroupName(beforeGroup);
            const to = normalizeGroupName(afterGroup);
            record.groups = uniqueTags([DEFAULT_ENV_GROUP].concat((record.groups || []).map(group => {
                const normalized = normalizeGroupName(group);
                return normalized === from ? to : normalized;
            })));
        }

        function modalFieldLabel(field) {
            const labels = {
                '組織コード': 'label.orgCode',
                '組織名': 'label.orgName',
                '環境グループ': 'label.envGroup',
                '構築環境名': 'label.envName',
                'URL': 'label.url',
                'ログインID': 'label.loginId',
                'ログインパスワード': 'label.password',
                'コピー先組織': 'label.copyTargetOrg'
            };
            return labels[field] ? t(labels[field]) : field;
        }

        function openAddModal(type, titleKey, fields, extra = {}) {
            addModalContext = { type, fields, extra };
            document.getElementById('addModalTitle').textContent = t(titleKey);
            const submitBtn = document.getElementById('addModalSubmitBtn');
            if (submitBtn) submitBtn.textContent = type.startsWith('edit-') ? t('button.save') : t('button.add');
            document.getElementById('addModalFields').innerHTML = fields.map(([field, value, wide, kind, options], index) => `
                <div class="add-modal-field${wide ? ' wide' : ''}">
                    <label>${sanitizeHTML(modalFieldLabel(field))}</label>
                    ${kind === 'select'
                        ? `<select data-add-field="${sanitizeHTML(field)}">${ENV_GROUP_OPTIONS.map(option => `<option value="${sanitizeHTML(option)}" ${option === value ? 'selected' : ''}>${option ? sanitizeHTML(option) : ''}</option>`).join('')}</select>`
                        : kind === 'group-select'
                            ? `<select data-add-field="${sanitizeHTML(field)}">${(options || groupNameOptions()).map(option => `<option value="${sanitizeHTML(option)}" ${option === value ? 'selected' : ''}>${sanitizeHTML(option)}</option>`).join('')}</select>`
                        : kind === 'group-input'
                            ? `<input data-add-field="${sanitizeHTML(field)}" value="${sanitizeHTML(value || '')}" list="groupOptions_${index}"><datalist id="groupOptions_${index}">${groupNameOptions(addModalContext && addModalContext.extra && addModalContext.extra.orgKey).map(option => `<option value="${sanitizeHTML(option)}"></option>`).join('')}</datalist>`
                        : kind === 'org-select'
                            ? `<select data-add-field="${sanitizeHTML(field)}">${(options || getOrgOptions()).map(org => `<option value="${sanitizeHTML(org.key)}" ${org.key === value ? 'selected' : ''}>${sanitizeHTML(org.label)}</option>`).join('')}</select>`
                        : `<input data-add-field="${sanitizeHTML(field)}" value="${sanitizeHTML(value || '')}">`}

            addModalContext = null;
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('addModalFields').innerHTML = '';
        }

        function addModalValues() {
            const values = {};
            document.querySelectorAll('#addModalFields [data-add-field]').forEach(input => {
                values[input.dataset.addField] = input.value.trim();
            });
            return values;
        }

        function submitAddModal() {
            if (!addModalContext) return;
            const values = addModalValues();
            if (addModalContext.type === 'org') {
                if (!values['組織名']) return alert(t('error.orgNameRequired'));
                const org = {
                    key: orgKeyFromParts(values['組織コード'], values['組織名']),
                    code: values['組織コード'] || '',
                    name: values['組織名'] || '',
                    label: values['組織コード'] ? `${values['組織コード']} ${values['組織名']}` : values['組織名'],
                    isUnset: false
                };
                ensureEnvGroupRecord(org);
                resetPortalDerivedCaches();
                closeAddModal();
                savePortalFiles({ action: 'add-org', level: 'org', after: { org, groups: getEnvGroupsForOrg(org.key) } })
                    .then(() => {
                        showToast(t('toast.savedDetail'));
                        initDropdown();
                        renderOrgFilterMenu();
                        document.getElementById('orgSelect').value = org.key;
                        syncProductionNavLink();
                        renderEnvironments(org.key);
                    })
                    .catch(err => alert(t('error.save') + err.message));
                return;
            }
            if (addModalContext.type === 'edit-org') {
                updateOrganization(addModalContext.extra.orgKey, values);
                return;
            }
            if (addModalContext.type === 'group') {
                addGroupToOrg(addModalContext.extra.orgKey, values);
                return;
            }
            if (addModalContext.type === 'edit-group') {
                updateGroup(addModalContext.extra.orgKey, addModalContext.extra.groupValue, values);
                return;
            }
            if (addModalContext.type === 'env') {
                const org = addModalContext.extra.org;
                if (!org) return;
                const row = Object.fromEntries(DATA_FIELDS.map(field => [field, '']));
                row['組織コード'] = org.code || '';
                row['組織名'] = org.name || '';
                row['環境グループ'] = normalizeGroupName(values['環境グループ'] || addModalContext.extra.groupName);
                DATA_FIELDS.forEach(field => { if (values[field] !== undefined) row[field] = values[field]; });
                row['環境グループ'] = normalizeGroupName(row['環境グループ']);
                addGroupNameToOrg(org.key, row['環境グループ']);
                row.__rowId = `env_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                fullData.push(row);
                resetPortalDerivedCaches();
                closeAddModal();
                renderEnvironments(org.key);
                editEnvironmentCard(row.__rowId);
            }
            if (addModalContext.type === 'copy-env') {
                copyEnvironmentToOrg(addModalContext.extra.rowId, values['コピー先組織']);
            }
        }

        function renderTagFilters() {
            const tagPanel = document.getElementById('tagFilterPanel');
            const tagSet = new Set();
            const tagCounts = {};
            fullData.forEach(row => {
                allTagsForRow(row).forEach(tag => {
                    tagSet.add(tag);
                    tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                });
            });

            tagPanel.innerHTML = '';
            if (tagSet.size === 0) {
                tagPanel.innerHTML = `<span class="tag-empty">${t('filter.noTags')}</span>`;
                return;
            }
            const groups = groupTags(Array.from(tagSet).sort());
            tagCategoryConfig.categories.forEach(group => {
                const tags = groups[group.id] || [];
                if (tags.length === 0) return;
                const row = document.createElement('div');
                row.className = 'tag-filter-group';
                const label = document.createElement('div');
                label.className = 'tag-filter-group-label';
                label.textContent = tagCategoryLabel(group);
                const items = document.createElement('div');
                items.className = 'tag-filter-group-items';
                tags.forEach(tag => {
                    const skinStyle = tagFilterSkinStyle(tag);
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'tag-filter-btn' + (selectedTags.includes(tag) ? ' active' : '');
                    btn.title = tag;
                    if (skinStyle) {
                        btn.dataset.skin = '1';
                        btn.style.setProperty('--tag-filter-skin-bg', skinStyle.bg);
                        btn.style.setProperty('--tag-filter-skin-border', skinStyle.border);
                        btn.style.setProperty('--tag-filter-skin-accent', skinStyle.accent);
                    }
                    btn.innerHTML = `
                        <span class="tag-filter-check" aria-hidden="true"></span>
                        <span class="tag-filter-name">${sanitizeHTML(tag)}</span>
                        <span class="tag-filter-count">(${tagCounts[tag] || 0})</span>
                    `;
                    btn.onclick = () => toggleTag(tag);
                    items.appendChild(btn);
                });
                row.appendChild(label);
                row.appendChild(items);
                tagPanel.appendChild(row);
            });

            const clearBtn = document.createElement('button');
            clearBtn.type = 'button';
            clearBtn.className = 'tag-clear-btn';
            clearBtn.textContent = 'All';
            clearBtn.onclick = () => {
                selectedTags = [];
                currentOrgPage = 1;
                renderTagFilters();
                renderActiveView();
            };
            tagPanel.appendChild(clearBtn);
        }

        function toggleTag(tag) {
            selectedTags = selectedTags.includes(tag)
                ? selectedTags.filter(item => item !== tag)
                : selectedTags.concat(tag);
            currentOrgPage = 1;
            renderTagFilters();
            renderActiveView();
        }

        function refreshEnvironmentCardInPlace(rowId) {
            const env = fullData.find(row => row.__rowId === rowId);
            const currentCard = document.querySelector(`.env-card[data-env-row-id="${CSS.escape(rowId)}"]`);
            if (!env || !currentCard) {
                renderActiveView();
                return;
            }
            const replacement = createEnvironmentCard(env, Boolean(currentCard.dataset.showOrgTitle === '1'), getInlineContextFromCard(currentCard));
            currentCard.replaceWith(replacement);
            if (replacement.dataset.statusUrl) {
                replacement.dataset.statusObserved = '1';
                setTimeout(() => queueStatusCheck(replacement, true), 0);
            }

        function getInlineContextFromCard(card) {
            const item = card ? card.closest('.env-flow-item.expanded') : null;
            if (!item) return null;
            const prefix = 'env_item_';
            if (!item.id || !item.id.startsWith(prefix)) return null;
            const match = item.id.slice(prefix.length).match(/^(.*)_\d+$/);
            if (!match) return null;
            const keyPart = match[1];
            const org = getOrgGroups().find(candidate => sanitizeId(candidate.key) === keyPart);
            return org ? { orgKey: org.key } : null;
        }

        function moveTagsForRow(beforeRow, afterRow) {
            if (!beforeRow || !afterRow) return;
            const oldKey = getRowKey(beforeRow);
            const oldLegacyKey = getLegacyRowKey(beforeRow);
            const record = tagStore[oldKey] || tagStore[oldLegacyKey];
            delete tagStore[oldKey];
            delete tagStore[oldLegacyKey];

                tagStore[getRowKey(afterRow)] = record;

            if (event) {

            const org = getOrgOptions().find(item => item.key === orgKey);
            if (!org) return;
            openAddModal('edit-org', 'modal.orgEdit', [
                ['組織コード', org.code || ''],
                ['組織名', org.name || '', true],
            ], { orgKey });
