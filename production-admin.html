<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvPortal - 本番環境データ管理</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="i18n.js"></script>
    <style>
        .actions-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-card);
        }
        .production-toolbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .production-stat {
            color: var(--text-muted);
            font-size: 0.86rem;
        }
        .toolbar-pagination {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toolbar-pagination button {
            min-height: 34px;
            min-width: 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .toolbar-pagination button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .toolbar-pagination span {
            color: var(--text-muted);
            font-size: 0.86rem;
            min-width: 76px;
            text-align: center;
        }
        .org-card {
            padding: 0;
            overflow: hidden;
        }
        .org-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.25rem;
            background: #fff;
        }
        .org-header-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
        }
        .production-editor-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
            gap: 1.25rem;
            padding: 1rem 1.25rem 1.25rem;
        }
        .production-editor-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .production-editor-card-header {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        .production-editor-card-title {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1rem;
        }
        .production-editor-body {
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 0.85rem;
        }
        .production-section-title {
            grid-column: span 12;
            color: var(--text-main);
            font-weight: 700;
            padding-top: 0.2rem;
            border-top: 1px solid var(--border);
        }
        .production-section-title:first-child {
            border-top: 0;
            padding-top: 0;
        }
        .edit-field {
            min-width: 0;
        }
        .edit-field.span-3 { grid-column: span 3; }
        .edit-field.span-4 { grid-column: span 4; }
        .edit-field.span-6 { grid-column: span 6; }
        .edit-field.span-12 { grid-column: span 12; }
        .edit-field input,
        .edit-field select {
            width: 100%;
            min-height: 38px;
            padding: 0.45rem 0.6rem;
            font-size: 0.85rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .edit-field label {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            display: block;
            white-space: nowrap;
        }
        .production-editor-card-footer {
            display: flex;
            justify-content: flex-end;
            padding: 0.8rem 1rem;
            border-top: 1px solid var(--border);
            background: #fff;
        }
        .del-btn {
            background: #fff;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
            padding: 0.45rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .del-btn:hover {
            background-color: #ff4d4f;
            border-color: #ff4d4f;
            color: #fff;
        }
        @media (max-width: 760px) {
            .production-editor-list {
                grid-template-columns: 1fr;
            }
            .edit-field.span-3,
            .edit-field.span-4,
            .edit-field.span-6 {
                grid-column: span 12;
            }
        }
    </style>
</head>
<body data-title-key="app.productionAdminTitle">
    <header class="top-header">
        <div class="logo-area">
            <h1>Env<span>Portal</span></h1>
            <p data-i18n="header.productionAdminDesc">本番環境の VPN、踏み台、AP、DB 接続情報を管理します</p>
        </div>
        <nav class="main-nav">
            <div class="main-nav-inner">
                <a href="index.html" data-i18n="nav.search">環境検索</a>
                <a href="admin.html" data-i18n="nav.admin">データ管理</a>
                <a href="rdp.html" data-i18n="nav.rdp">サーバ接続情報管理</a>
                <a href="production.html" data-i18n="nav.production">本番環境</a>
                <a href="production-admin.html" class="active" data-i18n="nav.productionAdmin">本番環境データ管理</a>
            </div>
        </nav>
    </header>

    <div class="container" id="adminContainer" style="max-width: 1400px; width: 95%; margin: 0 auto; display: none;">
        <div class="actions-bar">
            <div class="production-toolbar-left">
                <select id="orgFilter" style="width: 280px; color: var(--primary); font-weight: 600;" onchange="currentOrgPage = 1; renderEditor()">
                    <option value="" data-i18n="select.allOrgs">▼ 全ての組織を表示</option>
                </select>
                <span id="productionStat" class="production-stat" data-i18n="state.loading">読み込み中...</span>
            </div>
            <div style="flex-grow: 1;"></div>
            <div id="toolbarPagination" class="toolbar-pagination"></div>
            <button id="btnAdd" type="button" class="secondary-btn" onclick="addNewRow()" data-i18n="button.addRow">＋ 新規行を追加</button>
            <button id="btnSave" type="button" class="primary-btn" onclick="saveToServer()" data-i18n="button.saveAll">保存する (一括更新)</button>
        </div>

        <div id="editorArea">
            <div style="text-align:center; color:var(--text-muted); padding: 4rem; border: 1px solid var(--border); background: var(--card); font-weight: bold;" data-i18n="state.loading">データを読み込んでいます...</div>
        </div>
    </div>
    <div id="toast" data-i18n="toast.saved">保存成功。</div>

    <script>
        let currentData = [];
        let currentOrgPage = 1;
        const ORGS_PER_PAGE = 6;
        const FIELDS = [
            '組織名',
            '構築環境名',
            '使用VPN',
            'VPN IP',
            'VPNユーザー名',
            'VPNパスワード',
            '踏み台IP',
            '踏み台ユーザー名',
            '踏み台パスワード',
            'AP IP',
            'APユーザー名',
            'APパスワード',
            'DB IP',
            'DBユーザー名',
            'DBパスワード'
        ];
        const FIELD_GROUPS = [
            { title: 'section.productionVpn', fields: [
                ['label.prodVpn', '使用VPN', 6],
                ['label.prodVpnIp', 'VPN IP', 6],
                ['label.prodVpnUser', 'VPNユーザー名', 6],
                ['label.prodVpnPassword', 'VPNパスワード', 6]
            ]},
            { title: 'section.productionBastion', fields: [
                ['label.prodBastionIp', '踏み台IP', 4],
                ['label.prodBastionUser', '踏み台ユーザー名', 4],
                ['label.prodBastionPassword', '踏み台パスワード', 4]
            ]},
            { title: 'section.productionAp', fields: [
                ['label.prodApIp', 'AP IP', 4],
                ['label.prodApUser', 'APユーザー名', 4],
                ['label.prodApPassword', 'APパスワード', 4]
            ]},
            { title: 'section.productionDb', fields: [
                ['label.prodDbIp', 'DB IP', 4],
                ['label.prodDbUser', 'DBユーザー名', 4],
                ['label.prodDbPassword', 'DBパスワード', 4]
            ]}
        ];

        window.addEventListener('DOMContentLoaded', () => {
            checkProtectedAccess();
        });

        window.addEventListener('i18n:changed', () => {
            initFilter();
            renderEditor();
        });

        function loadAdminData() {
            fetch('production.csv?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(response => response.ok ? response.text() : '')
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            currentData = results.data.map(normalizeRow);
                            initFilter();
                            renderEditor();
                        }
                    });
                })
                .catch(error => {
                    console.error('production.csv load failed:', error);
                    currentData = [];
                    initFilter();
                    renderEditor();
                });
        }

        function checkProtectedAccess() {
            fetch('auth_windows.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : { ok: false })
                .then(result => {
                    if (!result || !result.ok) {
                        window.location.href = 'index.html';
                        return;
                    }
                    document.getElementById('adminContainer').style.display = 'block';
                    loadAdminData();
                })
                .catch(() => {
                    window.location.href = 'index.html';
                });
        }

        function renderEditor() {
            const editorArea = document.getElementById('editorArea');
            editorArea.innerHTML = '';

            if (currentData.length === 0) {
                editorArea.innerHTML = `<div class="card" style="text-align:center; padding:4rem; color:var(--text-muted); font-weight: bold;">${t('state.noAdminData')}</div>`;
                renderSummary(0, 0, 1, 1);
                return;
            }

            const orgMap = new Map();
            currentData.forEach((row, idx) => {
                const org = (row['組織名'] || '').trim();
                const key = org === '' ? t('unset.org') : org;
                if (!orgMap.has(key)) orgMap.set(key, []);
                orgMap.get(key).push({ ...row, originalIndex: idx });
            });

            const sortedOrgs = Array.from(orgMap.keys()).sort((a, b) => {
                if (a === t('unset.org')) return -1;
                if (b === t('unset.org')) return 1;
                return a.localeCompare(b);
            });

            const filterVal = document.getElementById('orgFilter').value;
            const filteredOrgs = filterVal ? sortedOrgs.filter(org => org === filterVal || org === t('unset.org')) : sortedOrgs;

            if (filteredOrgs.length === 0) {
                renderSummary(0, currentData.length, 1, 1);
                editorArea.innerHTML = `<div class="card" style="text-align:center; padding:4rem; color:var(--text-muted); font-weight: 600;">${t('state.noMatchedOrg')}</div>`;
                return;
            }

            const totalPages = Math.ceil(filteredOrgs.length / ORGS_PER_PAGE);
            if (currentOrgPage > totalPages) currentOrgPage = Math.max(1, totalPages);
            if (currentOrgPage < 1) currentOrgPage = 1;
            renderSummary(filteredOrgs.length, currentData.length, currentOrgPage, Math.max(1, totalPages));

            const orgsToShow = filteredOrgs.slice((currentOrgPage - 1) * ORGS_PER_PAGE, currentOrgPage * ORGS_PER_PAGE);
            orgsToShow.forEach(org => {
                const orgBlock = document.createElement('div');
                orgBlock.className = 'card org-card';
                orgBlock.innerHTML = `<div class="org-block-header"><h2 class="org-header-title">${escapeHtml(org)}</h2></div>`;

                const list = document.createElement('div');
                list.className = 'production-editor-list';
                orgMap.get(org).forEach(item => {
                    const idx = item.originalIndex;
                    const card = document.createElement('div');
                    card.className = 'production-editor-card';
                    card.innerHTML = `
                        <div class="production-editor-card-header">
                            <div class="production-editor-card-title">${escapeHtml(item['構築環境名']) || t('unset.name')}</div>
                        </div>
                        <div class="production-editor-body">
                            <div class="edit-field span-6">
                                <label>${t('label.orgName')}</label>
                                <input type="text" value="${escapeHtml(item['組織名'])}" onchange="updateData(${idx}, '組織名', this.value)">
                            </div>
                            <div class="edit-field span-6">
                                <label>${t('label.envName')}</label>
                                <input type="text" value="${escapeHtml(item['構築環境名'])}" onchange="updateData(${idx}, '構築環境名', this.value)">
                            </div>
                            ${renderFieldGroups(idx, item)}
                        </div>
                        <div class="production-editor-card-footer">
                            <button type="button" class="del-btn" onclick="deleteRow(${idx})">${t('button.delete')}</button>
                        </div>
                    `;
                    list.appendChild(card);
                });

                orgBlock.appendChild(list);
                editorArea.appendChild(orgBlock);
            });
        }

        function renderFieldGroups(index, item) {
            return FIELD_GROUPS.map(group => `
                <div class="production-section-title">${t(group.title)}</div>
                ${group.fields.map(([labelKey, field, span]) => `
                    <div class="edit-field span-${span}">
                        <label>${t(labelKey)}</label>
                        <input type="text" value="${escapeHtml(item[field])}" onchange="updateData(${index}, '${field}', this.value)">
                    </div>
                `).join('')}
            `).join('');
        }

        function renderSummary(orgCount, rowCount, page, totalPages) {
            document.getElementById('productionStat').innerHTML = t('production.stat', { org: orgCount, production: rowCount });
            const pager = document.getElementById('toolbarPagination');
            pager.innerHTML = '';
            const prevBtn = document.createElement('button');
            prevBtn.type = 'button';
            prevBtn.textContent = '‹';
            prevBtn.onclick = () => changePage(-1);
            prevBtn.disabled = page <= 1;
            const pageSpan = document.createElement('span');
            pageSpan.textContent = `${page} / ${totalPages}`;
            const nextBtn = document.createElement('button');
            nextBtn.type = 'button';
            nextBtn.textContent = '›';
            nextBtn.onclick = () => changePage(1);
            nextBtn.disabled = page >= totalPages;
            pager.appendChild(prevBtn);
            pager.appendChild(pageSpan);
            pager.appendChild(nextBtn);
        }

        function changePage(direction) {
            currentOrgPage += direction;
            renderEditor();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateData(index, field, value) {
            currentData[index][field] = value;
            if (field === '組織名') initFilter();
        }

        function deleteRow(index) {
            if (confirm(t('confirm.delete'))) {
                currentData.splice(index, 1);
                saveToServer();
            }
        }

        function addNewRow() {
            const filterVal = document.getElementById('orgFilter').value;
            currentData.unshift(normalizeRow({ '組織名': filterVal || '' }));
            currentOrgPage = 1;
            initFilter();
            renderEditor();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initFilter() {
            const select = document.getElementById('orgFilter');
            const current = select.value;
            const orgs = Array.from(new Set(currentData.map(row => (row['組織名'] || '').trim()).filter(Boolean))).sort();
            select.innerHTML = `<option value="">${t('select.allOrgs')}</option>`;
            orgs.forEach(org => {
                const opt = document.createElement('option');
                opt.value = org;
                opt.textContent = org;
                select.appendChild(opt);
            });
            if (orgs.includes(current)) select.value = current;
        }

        function saveToServer() {
            const rows = currentData
                .map(normalizeRow)
                .filter(row => (row['組織名'] || row['構築環境名'] || '').trim() !== '' || hasProductionInfo(row));
            const csv = Papa.unparse({ fields: FIELDS, data: rows }, { quotes: true });
            fetch('update_production.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain; charset=UTF-8' },
                body: csv
            })
            .then(res => {
                if (res.ok) {
                    currentData = rows;
                    initFilter();
                    renderEditor();
                    showToast(t('toast.savedDetail'));
                } else {
                    res.text().then(text => alert('Server error: ' + text));
                }
            })
            .catch(err => {
                console.error(err);
                alert(t('error.network'));
            });
        }

        function normalizeRow(row) {
            const normalized = {};
            FIELDS.forEach(field => {
                normalized[field] = row && row[field] ? row[field] : '';
            });
            return normalized;
        }

        function hasProductionInfo(row) {
            return FIELDS.slice(2).some(field => (row[field] || '').trim() !== '');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
