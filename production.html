<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvPortal - 本番環境</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="i18n.js?v=2.4.2"></script>
    <script src="org_readings.js"></script>
    <style>
        .production-stat {
            color: var(--text-muted);
            font-size: 0.86rem;
            margin-bottom: 0.85rem;
            text-align: right;
        }
        .home-container {
            width: calc(100% - 2rem);
            margin: 0 auto;
            padding: 0 0 2rem;
        }
        .home-layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 1rem;
            align-items: start;
        }
        .side-filter-stack {
            position: sticky;
            top: 0.75rem;
            max-height: calc(100vh - 1.5rem);
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            overflow: hidden;
        }
        .org-filter-card {
            padding: 0.95rem 0.65rem 0.65rem;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .org-filter-card {
            flex: 0 0 auto;
            max-height: 44vh;
            min-height: 0;
        }
        .org-filter-menu {
            min-height: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .org-filter-menu summary {
            list-style: none;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.98rem;
            font-weight: 700;
            padding: 0 0.35rem 0.65rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .org-filter-summary-title {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .org-add-btn {
            min-height: 28px;
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
            background: #ffffff !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .add-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }
        .add-modal-content {
            width: min(720px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #fff;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.22);
            padding: 1.25rem;
        }
        .add-modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }
        .add-modal-field {
            display: grid;
            gap: 0.3rem;
        }
        .add-modal-field.wide {
            grid-column: span 2;
        }
        .add-modal-field label {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
        }
        .add-modal-field input {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.55rem 0.65rem;
            font: inherit;
        }
        .add-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1rem;
        }
        .org-filter-menu summary::-webkit-details-marker {
            display: none;
        }
        .org-filter-menu summary::after {
            content: "";
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 7px solid #94a3b8;
        }
        .org-filter-menu:not([open]) summary::after {
            transform: rotate(180deg);
        }
        .org-filter-body {
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            flex: 1 1 auto;
        }
        .org-filter-search {
            margin: 0 0.35rem;
            min-height: 34px;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0.42rem 0.55rem;
            background: #fff;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .org-filter-search {
            width: calc(100% - 0.7rem);
        }
        .org-filter-list {
            overflow-y: auto;
            padding: 0 0.2rem 0 0.35rem;
            scrollbar-width: thin;
            min-height: 0;
            max-height: 32vh;
        }
        .org-filter-tabs {
            display: flex;
            gap: 0.25rem;
            overflow-x: auto;
            padding: 0 0.35rem 0.25rem;
            scrollbar-width: thin;
        }
        .org-filter-tab {
            min-width: 34px;
            min-height: 28px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: #64748b;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            white-space: nowrap;
        }
        .org-filter-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .org-filter-tab.active {
            background: #111;
            border-color: #111;
            color: #fff;
        }
        .org-filter-group-items {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding-left: 0.1rem;
        }
        .org-filter-btn {
            width: 100%;
            border: 0;
            background: transparent;
            border-radius: 3px;
            padding: 0.34rem 0.2rem;
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            gap: 0.45rem;
            align-items: center;
            text-align: left;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.85rem;
        }
        .org-filter-btn:hover,
        .org-filter-btn.active {
            background: #f8fafc;
        }
        .org-filter-btn.active {
            color: var(--primary);
            font-weight: 700;
        }
        .org-filter-check {
            width: 19px;
            height: 19px;
            border: 2px solid #cbd5df;
            border-radius: 3px;
            background: #f8fbfc;
            display: inline-block;
            position: relative;
        }
        .org-filter-btn.active .org-filter-check {
            border-color: var(--primary);
            background: #fff;
        }
        .org-filter-btn.active .org-filter-check::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 1px;
            background: var(--primary);
        }
        .org-filter-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .production-grid {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .production-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
            min-height: 132px;
        }
        .production-card-head {
            padding: 1rem;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.75rem;
            align-items: flex-start;
            background: #fbfdff;
        }
        .production-title {
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .production-subtitle {
            color: var(--text-muted);
            font-size: 0.82rem;
            margin-top: 0.2rem;
            overflow-wrap: anywhere;
        }
        .production-tag {
            border: 1px solid #c8e5ec;
            background: #eef9fb;
            color: #087ea4;
            border-radius: 999px;
            padding: 0.2rem 0.55rem;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .production-blocks {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: stretch;
        }
        .production-section {
            padding: 0.85rem 0.9rem;
            border-right: 1px solid var(--border);
            min-width: 0;
        }
        .production-section:last-child {
            border-right: 0;
        }
        .production-section-title {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-size: 0.86rem;
        }
        .production-detail {
            display: grid;
            grid-template-columns: minmax(72px, 0.72fr) minmax(0, 1fr) 30px;
            gap: 0.4rem;
            align-items: center;
            padding: 0.22rem 0;
        }
        .production-detail-label {
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .production-detail-value {
            min-width: 0;
            overflow-wrap: anywhere;
            color: var(--text-main);
            font-size: 0.84rem;
            line-height: 1.35;
        }
        .production-placeholder {
            color: #a0aeb8;
            font-size: 0.82rem;
            padding-top: 0.2rem;
        }
        .production-detail .icon-btn {
            width: 30px;
            height: 30px;
            min-width: 30px;
        }
        .production-card-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-left: auto;
        }
        .production-card-actions .secondary-btn,
        .production-card-actions .primary-btn {
            width: 30px;
            height: 30px;
            min-height: 30px;
            padding: 0;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .production-card-actions svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
        }
        .production-editor-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }
        .production-editor-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 0.75rem;
        }
        .production-editor-field {
            grid-column: span 4;
            display: grid;
            gap: 0.3rem;
        }
        .production-editor-field label {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
        }
        .production-editor-field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.55rem 0.65rem;
            font: inherit;
        }
        .production-editor-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.75rem;
        }
        @media (max-width: 1100px) {
            .home-container {
                width: calc(100% - 1rem);
            }
            .home-layout {
                grid-template-columns: 1fr;
            }
            .side-filter-stack {
                position: static;
                max-height: none;
            }
            .org-filter-card {
                max-height: none;
            }
            .production-card {
                grid-template-columns: 1fr;
            }
            .production-card-head {
                border-right: 0;
                border-bottom: 1px solid var(--border);
                flex-direction: row;
                align-items: flex-start;
            }
            .production-blocks {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .production-section:nth-child(2n) {
                border-right: 0;
            }
            .production-section:nth-child(n + 3) {
                border-top: 1px solid var(--border);
            }
        }
        @media (max-width: 640px) {
            .production-blocks {
                grid-template-columns: 1fr;
            }
            .production-section {
                border-right: 0;
                border-top: 1px solid var(--border);
            }
            .production-section:first-child {
                border-top: 0;
            }
            .production-detail {
                grid-template-columns: minmax(90px, 0.7fr) minmax(0, 1fr) 30px;
            }
            .production-stat {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body data-title-key="app.productionTitle">
    <header class="top-header">
        <div class="logo-area">
            <h1>Env<span>Portal</span></h1>
            <p data-i18n="header.productionDesc">本番環境の接続情報を検索・表示します</p>
        </div>
        <nav class="main-nav">
            <div class="main-nav-inner">
                <a href="index.html" data-i18n="nav.search">環境検索</a>
                <a href="production.html" class="active" data-i18n="nav.production">本番環境</a>
            </div>
        </nav>
    </header>

    <div class="container home-container">
        <div class="home-layout">
            <div class="side-filter-stack">
                <div class="card org-filter-card">
                    <details id="orgFilterMenu" class="org-filter-menu" open>
                        <summary>
                            <span class="org-filter-summary-title" data-i18n="label.orgSelect">組織選択</span>
                            <button id="orgAddBtn" type="button" class="secondary-btn org-add-btn" onclick="addProductionOrganization(event)" data-i18n="button.add" hidden>追加</button>
                        </summary>
                        <div class="org-filter-body">
                            <input id="orgFilterSearch" class="org-filter-search" type="search" data-i18n-placeholder="label.orgName" placeholder="" oninput="renderOrgFilterMenu()">
                            <div id="orgFilterList" class="org-filter-list"></div>
                        </div>
                    </details>
                </div>
            </div>

            <div>
                <div id="productionStat" class="production-stat" data-i18n="state.loading">読み込み中...</div>
                <div id="productionArea" class="production-grid">
                    <div class="empty-state" style="grid-column:1 / -1;" data-i18n="state.loading">データ読み込み中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" data-i18n="toast.copied">コピーしました</div>

    <div id="addModal" class="add-modal">
        <div class="add-modal-content">
            <h3 data-i18n="modal.productionAdd">本番環境追加</h3>
            <div id="addModalFields" class="add-modal-grid">
                <div class="add-modal-field wide">
                    <label data-i18n="label.orgName">組織名</label>
                    <input data-add-field="組織名">
                </div>
                <div class="add-modal-field wide">
                    <label data-i18n="label.envName">構築環境名</label>
                    <input data-add-field="構築環境名" data-default-key="default.productionEnvName">
                </div>
            </div>
            <div class="add-modal-actions">
                <button type="button" class="secondary-btn" onclick="closeProductionAddModal()" data-i18n="button.cancel">キャンセル</button>
                <button type="button" class="primary-btn" onclick="submitProductionAddModal()" data-i18n="button.add">追加</button>
            </div>
        </div>
    </div>

    <script>
        let productionData = [];
        let selectedOrg = '';
        let initialOrgApplied = false;
        let canEdit = false;
        let canManageUsers = false;
        let editingProductionId = '';
        let portalConfig = {};
        let selectedOrgKanaTab = '';
        const PRODUCTION_FIELDS = ["組織名","構築環境名","使用VPN","VPN IP","VPNユーザー名","VPNパスワード","踏み台IP","踏み台ユーザー名","踏み台パスワード","AP IP","APユーザー名","APパスワード","DB IP","DBユーザー名","DBパスワード"];

        const FIELD_GROUPS = [
            { title: 'section.productionVpn', fields: [
                ['label.prodVpn', '使用VPN'],
                ['label.prodVpnIp', 'VPN IP'],
                ['label.prodVpnUser', 'VPNユーザー名'],
                ['label.prodVpnPassword', 'VPNパスワード']
            ]},
            { title: 'section.productionBastion', fields: [
                ['label.prodBastionIp', '踏み台IP'],
                ['label.prodBastionUser', '踏み台ユーザー名'],
                ['label.prodBastionPassword', '踏み台パスワード']
            ]},
            { title: 'section.productionAp', fields: [
                ['label.prodApIp', 'AP IP'],
                ['label.prodApUser', 'APユーザー名'],
                ['label.prodApPassword', 'APパスワード']
            ]},
            { title: 'section.productionDb', fields: [
                ['label.prodDbIp', 'DB IP'],
                ['label.prodDbUser', 'DBユーザー名'],
                ['label.prodDbPassword', 'DBパスワード']
            ]}
        ];
        window.addEventListener('DOMContentLoaded', () => {
            loadPortalConfig().then(() => checkWindowsAuth({ allowProxy: false }));
            loadProductionData();
        });
        window.addEventListener('i18n:changed', () => {
            renderOrgFilterMenu();
            renderProduction();
        });

        function loadProductionData() {
            portalFetch('production_data.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(response => response.ok ? response.json() : Promise.reject(new Error('production_data load failed')))
                .then(payload => {
                    canEdit = Boolean(payload && (payload.canEditProduction || payload.canEdit));
                    canManageUsers = Boolean(payload && payload.canManageUsers);
                    setCurrentUser(payload);
                    setSystemMenuVisible(isSystemAdmin(payload));
                    productionData = assignRowIds((payload.data || []).filter(hasProductionInfo), 'prod');
                    updateOrgAddButton();
                    applyInitialOrgFromQuery();
                    renderOrgFilterMenu();
                    renderProduction();
                    syncOrgReadingsAndRefresh();
                })
                .catch(error => {
                    console.error('production_data load failed:', error);
                    productionData = [];
                    updateOrgAddButton();
                    renderOrgFilterMenu();
                    renderProduction();
                });
        }

        function applyInitialOrgFromQuery() {
            if (initialOrgApplied) return;
            initialOrgApplied = true;
            const org = new URLSearchParams(window.location.search).get('org') || '';
            if (!org) return;
            if (getOrgOptions().includes(org)) {
                selectedOrg = org;
            }
        }

        function checkWindowsAuth(options = {}) {
            portalFetch('auth_windows.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : { ok: false })
                .then(result => {
                    canEdit = Boolean(result && (result.canEditProduction || result.canEdit));
                    canManageUsers = Boolean(result && result.canManageUsers);
                    setCurrentUser(result);
                    setSystemMenuVisible(isSystemAdmin(result));
                    updateOrgAddButton();
                    renderProduction();
                })
                .catch(() => {
                    canEdit = false;
                    canManageUsers = false;
                    setCurrentUser(null);
                    setSystemMenuVisible(false);
                    updateOrgAddButton();
                    renderProduction();
                });
        }

        function assignRowIds(rows, prefix) {
            return rows.map((row, index) => ({ ...row, __rowId: row.__rowId || `${prefix}_${Date.now()}_${index}_${Math.random().toString(36).slice(2)}` }));
        }

        function updateOrgAddButton() {
            const orgAddBtn = document.getElementById('orgAddBtn');
            if (orgAddBtn) orgAddBtn.hidden = !canEdit;
        }

        function renderOrgFilterMenu() {
            const list = document.getElementById('orgFilterList');
            if (!list) return;
            const searchInput = document.getElementById('orgFilterSearch');
            const keyword = (searchInput ? searchInput.value : '').trim().toLowerCase();
            const orgs = getOrgOptions().filter(org => {
                if (!keyword) return true;
                return org.toLowerCase().includes(keyword);
            });

            list.innerHTML = '';
            if (orgs.length === 0) {
                list.innerHTML = `<div class="production-placeholder">${t('state.noMatchedOrg')}</div>`;
                return;
            }

            const grouped = groupOrgsByKana(orgs);
            const currentOrgKana = selectedOrg ? kanaGroupForName(selectedOrg) : '';
            const availableLabels = new Set(grouped.map(group => group.label));
            if (currentOrgKana && availableLabels.has(currentOrgKana)) selectedOrgKanaTab = currentOrgKana;
            if (!selectedOrgKanaTab || !availableLabels.has(selectedOrgKanaTab)) selectedOrgKanaTab = grouped[0].label;

            const tabs = document.createElement('div');
            tabs.className = 'org-filter-tabs';
            grouped.forEach(group => {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'org-filter-tab' + (group.label === selectedOrgKanaTab ? ' active' : '');
                tab.textContent = group.label;
                tab.title = group.label;
                tab.onclick = () => {
                    selectedOrgKanaTab = group.label;
                    renderOrgFilterMenu();
                };
                tabs.appendChild(tab);
            });
            list.appendChild(tabs);

            const activeGroup = grouped.find(group => group.label === selectedOrgKanaTab) || grouped[0];
            const items = document.createElement('div');
            items.className = 'org-filter-group-items';
            activeGroup.items.forEach(org => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'org-filter-btn' + (selectedOrg === org ? ' active' : '');
                btn.title = org;
                btn.innerHTML = `
                    <span class="org-filter-check" aria-hidden="true"></span>
                    <span class="org-filter-name">${escapeHtml(org)}</span>
                `;
                btn.onclick = () => selectOrgFromMenu(org);
                items.appendChild(btn);
            });
            list.appendChild(items);
        }

        function getOrgOptions() {
            return Array.from(new Set(productionData.map(row => (row['組織名'] || '').trim()).filter(Boolean)))
                .sort((a, b) => a.localeCompare(b, 'ja'));
        }

        function syncOrgReadingsAndRefresh() {
            portalFetch('org_readings_status.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : Promise.reject(new Error('org readings load failed')))
                .then(payload => {
                    const overrides = { ...(window.ORG_READING_OVERRIDES || {}) };
                    (payload.records || []).forEach(record => {
                        if (record.name && record.reading) overrides[record.name] = record.reading;
                    });
                    window.ORG_READING_OVERRIDES = overrides;
                    renderOrgFilterMenu();
                })
                .catch(error => console.warn('org readings sync failed:', error));
        }

        function groupOrgsByKana(orgs) {
            const order = [
                'あ', 'い', 'う', 'え', 'お',
                'か', 'き', 'く', 'け', 'こ',
                'さ', 'し', 'す', 'せ', 'そ',
                'た', 'ち', 'つ', 'て', 'と',
                'な', 'に', 'ぬ', 'ね', 'の',
                'は', 'ひ', 'ふ', 'へ', 'ほ',
                'ま', 'み', 'む', 'め', 'も',
                'や', 'ゆ', 'よ',
                'ら', 'り', 'る', 'れ', 'ろ',
                'わ', 'を', 'ん',
                t('kana.other')
            ];
            const groups = new Map(order.map(label => [label, []]));
            orgs.forEach(org => {
                groups.get(kanaGroupForName(org)).push(org);
            });
            return order
                .map(label => ({ label, items: groups.get(label) || [] }))
                .filter(group => group.items.length > 0);
        }

        function kanaGroupForName(name) {
            const text = String(name || '').trim().normalize('NFKC');
            if (!text) return t('kana.other');
            const reading = (window.ORG_READING_OVERRIDES && window.ORG_READING_OVERRIDES[text]) || text;
            const first = toHiragana(String(reading).charAt(0));
            return normalizeKanaInitial(first) || t('kana.other');
        }

        function normalizeKanaInitial(char) {
            const map = {
                'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お',
                'が': 'か', 'ぎ': 'き', 'ぐ': 'く', 'げ': 'け', 'ご': 'こ',
                'ざ': 'さ', 'じ': 'し', 'ず': 'す', 'ぜ': 'せ', 'ぞ': 'そ',
                'だ': 'た', 'ぢ': 'ち', 'づ': 'つ', 'で': 'て', 'ど': 'と',
                'っ': 'つ',
                'ば': 'は', 'び': 'ひ', 'ぶ': 'ふ', 'べ': 'へ', 'ぼ': 'ほ',
                'ぱ': 'は', 'ぴ': 'ひ', 'ぷ': 'ふ', 'ぺ': 'へ', 'ぽ': 'ほ',
                'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ'
            };
            if (map[char]) return map[char];
            if ('あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.includes(char)) return char;
            return '';
        }

        function toHiragana(char) {
            const code = char.charCodeAt(0);
            if (code >= 0x30A1 && code <= 0x30F6) {
                return String.fromCharCode(code - 0x60);
            }
            return char;
        }

        function selectOrgFromMenu(org) {
            selectedOrg = selectedOrg === org ? '' : org;
            renderOrgFilterMenu();
            renderProduction();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addProductionOrganization(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!canEdit) return;
            document.querySelectorAll('#addModalFields [data-default-key]').forEach(input => {
                input.value = t(input.dataset.defaultKey);
            });
            document.getElementById('addModal').style.display = 'flex';
            const firstInput = document.querySelector('#addModalFields input');
            if (firstInput) firstInput.focus();
        }

        function closeProductionAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function submitProductionAddModal() {
            if (!canEdit) return;
            const values = {};
            document.querySelectorAll('#addModalFields [data-add-field]').forEach(input => {
                values[input.dataset.addField] = input.value.trim();
            });
            if (!values['組織名']) return alert(t('error.orgNameRequired'));
            const row = Object.fromEntries(PRODUCTION_FIELDS.map(field => [field, '']));
            row['組織名'] = values['組織名'];
            row['構築環境名'] = values['構築環境名'] || t('default.productionEnvName');
            row.__rowId = `prod_${Date.now()}_${Math.random().toString(36).slice(2)}`;
            productionData.push(row);
            selectedOrg = row['組織名'];
            editingProductionId = row.__rowId;
            closeProductionAddModal();
            renderOrgFilterMenu();
            renderProduction();
        }

        function editProductionCard(rowId) {
            if (!canEdit) return;
            editingProductionId = rowId;
            renderProduction();
        }

        function saveProductionCard(rowId) {
            if (!canEdit) return;
            document.querySelectorAll(`#productionArea input[data-row-id="${CSS.escape(rowId)}"]`).forEach(input => {
                const row = productionData.find(item => item.__rowId === input.dataset.rowId);
                if (row) row[input.dataset.field] = input.value.trim();
            });
            const csv = Papa.unparse({ fields: PRODUCTION_FIELDS, data: productionData }, { quotes: true });
            portalFetch('update_production.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                body: csv
            })
                .then(res => res.ok ? res.text() : Promise.reject(new Error('production.csv save failed')))
                .then(() => {
                    showToast(t('toast.savedDetail'));
                    editingProductionId = '';
                    renderOrgFilterMenu();
                    renderProduction();
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function renderProductionCardEditor(row) {
            const rowId = escapeJs(row.__rowId);
            const fields = PRODUCTION_FIELDS.map(field => `
                <div class="production-editor-field">
                    <label>${escapeHtml(field)}</label>
                    <input data-row-id="${rowId}" data-field="${escapeHtml(field)}" value="${escapeHtml(row[field] || '')}">
                </div>
            `).join('');
            return `<div class="production-editor-grid">${fields}</div>`;
        }

        function renderProduction() {
            const area = document.getElementById('productionArea');
            const rows = productionData.filter(row => {
                if (selectedOrg && row['組織名'] !== selectedOrg) return false;
                return true;
            });

            document.getElementById('productionStat').innerHTML = t('production.stat', {
                org: new Set(rows.map(row => row['組織名']).filter(Boolean)).size,
                production: rows.length
            });

            if (rows.length === 0) {
                area.innerHTML = `<div class="empty-state" style="grid-column:1 / -1;">${t('state.noData')}</div>`;
                return;
            }

            area.innerHTML = rows.map(renderProductionCard).join('');
        }

        function renderProductionCard(row) {
            const sections = FIELD_GROUPS.map(group => renderSection(row, group)).join('');
            const isEditing = canEdit && editingProductionId === row.__rowId;
            const actions = canEdit ? `
                <span class="production-card-actions">
                    ${isEditing
                        ? `<button type="button" class="primary-btn" onclick="saveProductionCard('${escapeJs(row.__rowId)}')" title="${t('button.save')}" aria-label="${t('button.save')}">${saveActionIcon()}</button>`
                        : `<button type="button" class="secondary-btn" onclick="editProductionCard('${escapeJs(row.__rowId)}')" title="${t('button.edit')}" aria-label="${t('button.edit')}">${editActionIcon()}</button>`}
                </span>
            ` : '';
            return `
                <div class="production-card">
                    <div class="production-card-head">
                        <div>
                            <div class="production-title">${escapeHtml(row['構築環境名'] || t('unset.name'))}</div>
                            <div class="production-subtitle">${escapeHtml(row['組織名'] || t('unset.org'))}</div>
                        </div>
                        ${actions}
                        <span class="production-tag">${t('nav.production')}</span>
                    </div>
                    ${isEditing ? renderProductionCardEditor(row) : `<div class="production-blocks">${sections}</div>`}
                </div>
            `;
        }

        function renderSection(row, group) {
            const details = group.fields.map(([labelKey, field]) => {
                const value = (row[field] || '').trim();
                if (!value) return '';
                return `
                    <div class="production-detail">
                        <div class="production-detail-label">${t(labelKey)}</div>
                        <div class="production-detail-value">${escapeHtml(value)}</div>
                        <button class="icon-btn" onclick="copyText('${escapeJs(value)}')" title="${t('button.copy')}" aria-label="${t('button.copy')}">${copyIcon()}</button>
                    </div>
                `;
            }).filter(Boolean).join('');
            return `
                <div class="production-section">
                    <div class="production-section-title">${t(group.title)}</div>
                    ${details || `<div class="production-placeholder">${t('unset.value')}</div>`}
                </div>
            `;
        }

        function hasProductionInfo(row) {
            return FIELD_GROUPS.some(group => group.fields.some(([, field]) => (row[field] || '').trim() !== ''));
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => showToast(t('toast.copied')));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJs(str) {
            return escapeHtml(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function copyIcon() {
            return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        }
        function editActionIcon() {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19V6.5A2.5 2.5 0 0 1 6.5 4H13"/><path d="M14 19H4"/><path d="M8 16l2.7-.7L19 7a2.1 2.1 0 0 0-3-3L7.7 12.3 7 15z"/></svg>`;
        }
        function saveActionIcon() {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg>`;
        }

        function loadPortalConfig() {
            return fetch('portal_config.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : {})
                .then(config => {
                    portalConfig = config || {};
                    return portalConfig;
                })
                .catch(() => {
                    portalConfig = {};
                    return portalConfig;
                });
        }
    </script>
</body>
</html>
