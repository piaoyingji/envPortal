<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvPortal - タグ表示設定</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js?v=2.4.7"></script>
    <style>
        .skin-admin-container {
            width: calc(100% - 2rem);
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 0 2rem;
        }
        .skin-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.85rem;
        }
        .skin-toolbar h2 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--text-main);
        }
        .skin-help {
            margin: 0 0 0.85rem;
            color: var(--text-muted);
            font-size: 0.84rem;
        }
        .skin-grid {
            display: grid;
            gap: 0.85rem;
        }
        .skin-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .skin-tab {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-main);
            border-radius: 6px;
            padding: 0.48rem 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .skin-tab.active {
            border-color: var(--text-main);
            background: var(--text-main);
            color: #fff;
        }
        .skin-active-summary {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            width: fit-content;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #f8fafc;
            color: var(--text-main);
            padding: 0.48rem 0.7rem;
            font-size: 0.84rem;
            font-weight: 700;
        }
        .skin-active-summary strong {
            color: var(--primary);
        }
        .skin-active-summary .secondary-btn {
            margin-left: 0.4rem;
            padding: 0.28rem 0.58rem;
            min-height: 28px;
        }
        .skin-category {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow-card);
            padding: 0.9rem;
        }
        .skin-category h3 {
            margin: 0 0 0.75rem;
            font-size: 1rem;
            color: var(--text-main);
        }
        .skin-row {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) repeat(3, minmax(96px, 130px)) minmax(140px, 1fr);
            gap: 0.7rem;
            align-items: center;
            padding: 0.55rem 0;
            border-top: 1px solid var(--border);
        }
        .skin-row:first-of-type {
            border-top: 0;
        }
        .skin-tag-name {
            font-weight: 700;
            color: var(--text-main);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .skin-field {
            display: grid;
            gap: 0.25rem;
        }
        .skin-field label {
            color: var(--text-muted);
            font-size: 0.74rem;
            font-weight: 700;
        }
        .skin-field input {
            width: 100%;
            min-height: 34px;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0.35rem 0.45rem;
            background: #fff;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.82rem;
        }
        .skin-color-input {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 0.4rem;
            align-items: center;
        }
        .skin-color-picker {
            width: 42px !important;
            min-height: 34px;
            padding: 2px !important;
            cursor: pointer;
            font-family: inherit !important;
        }
        .skin-preview {
            min-height: 42px;
            border: 1px solid var(--skin-border);
            border-radius: 8px;
            background: var(--skin-bg);
            color: var(--skin-accent);
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            font-weight: 700;
        }
        .page-message {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            color: var(--text-muted);
        }
        @media (max-width: 820px) {
            .skin-row {
                grid-template-columns: 1fr;
            }
            .skin-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body data-title-key="nav.tagSkins">
    <header class="top-header">
        <div class="logo-area">
            <h1>Env<span>Portal</span></h1>
            <p data-i18n="tagSkinAdmin.description">タグごとのパネル表示を管理します</p>
        </div>
        <nav class="main-nav">
            <div class="main-nav-inner">
                <a href="index.html" data-i18n="nav.search">環境検索</a>
                <a href="production.html" data-i18n="nav.production">本番環境</a>
            </div>
        </nav>
    </header>

    <main class="skin-admin-container">
        <div class="skin-toolbar">
            <h2 data-i18n="nav.tagSkins">タグ表示設定</h2>
            <button id="saveSkinsBtn" type="button" class="primary-btn" onclick="saveSkins()" data-i18n="button.save" hidden>保存</button>
        </div>
        <p class="skin-help" data-i18n="tagSkinAdmin.help">分類ごとにタグの背景、枠線、強調色を設定します。未設定のタグは通常表示です。</p>
        <div id="skinArea" class="page-message" data-i18n="state.loading">読み込み中...</div>
    </main>

    <div id="toast" data-i18n="toast.saved">保存成功。</div>

    <script>
        const DEFAULT_SKINS = {
            'UHR': { bg: '#f0fdf4', border: '#bbf7d0', accent: '#16a34a' },
            'PHR': { bg: '#eff6ff', border: '#bfdbfe', accent: '#2563eb' },
            'UPDS-V6': { bg: '#f8fafc', border: '#cbd5e1', accent: '#64748b' },
            'UPDSV6': { bg: '#f8fafc', border: '#cbd5e1', accent: '#64748b' },
            'UPDS-V7': { bg: '#fff7ed', border: '#fed7aa', accent: '#f97316' },
            'UPDSV7': { bg: '#fff7ed', border: '#fed7aa', accent: '#f97316' }
        };
        let tagCategories = normalizeTagCategories(null);
        let allTags = [];
        let canManageUsers = false;
        let activeCategoryId = '';

        window.addEventListener('DOMContentLoaded', loadSkins);
        window.addEventListener('i18n:changed', renderSkins);

        function loadSkins() {
            portalFetch('tag_categories_data.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : Promise.reject(new Error('Forbidden')))
                .then(payload => {
                    tagCategories = normalizeTagCategories(payload.tagCategories || {});
                    allTags = uniqueTags(payload.tags || []);
                    canManageUsers = Boolean(payload.canManageUsers);
                    setCurrentUser(payload);
                    setSystemMenuVisible(isSystemAdmin(payload));
                    document.getElementById('saveSkinsBtn').hidden = !canManageUsers;
                    renderSkins();
                })
                .catch(() => {
                    canManageUsers = false;
                    setCurrentUser(null);
                    setSystemMenuVisible(false);
                    document.getElementById('saveSkinsBtn').hidden = true;
                    document.getElementById('skinArea').innerHTML = t('tagSkinAdmin.noPermission');
                });
        }

        function renderSkins() {
            const area = document.getElementById('skinArea');
            if (!allTags.length) {
                area.className = 'page-message';
                area.innerHTML = t('tagSkinAdmin.noTags');
                return;
            }
            area.className = 'skin-grid';
            const categories = tagCategories.categories
                .map(category => ({ category, tags: allTags.filter(tag => categoryIdForTag(tag) === category.id) }))
                .filter(item => item.tags.length);
            if (!categories.some(item => item.category.id === activeCategoryId)) {
                activeCategoryId = categories[0].category.id;
            }
            const activeItem = categories.find(item => item.category.id === activeCategoryId) || categories[0];
            const systemCategory = tagCategories.categories.find(category => category.id === tagCategories.activeSkinCategory);
            const systemLabel = systemCategory ? categoryLabel(systemCategory) : categoryLabel(activeItem.category);
            const setSystemButton = activeItem.category.id === tagCategories.activeSkinCategory
                ? ''
                : `<button type="button" class="secondary-btn" onclick="setActiveSkinCategory('${escapeJs(activeItem.category.id)}')">${t('button.useForRendering')}</button>`;
            area.innerHTML = `
                <div class="skin-tabs">
                    ${categories.map(item => renderCategoryTab(item.category)).join('')}
                </div>
                <div class="skin-active-summary">${t('label.systemSkinCategory')}: <strong>${escapeHtml(systemLabel)}</strong>${setSystemButton}</div>
                <div class="skin-active-summary">${t('label.editingSkinCategory')}: <strong>${escapeHtml(categoryLabel(activeItem.category))}</strong><span>${t('label.switchSkinCategory')}</span></div>
                ${renderCategory(activeItem.category, activeItem.tags)}
            `;
            refreshPreviews();
        }

        function renderCategoryTab(category) {
            const activeClass = category.id === activeCategoryId ? ' active' : '';
            return `<button type="button" class="skin-tab${activeClass}" onclick="selectSkinCategory('${escapeJs(category.id)}')">${escapeHtml(categoryLabel(category))}</button>`;
        }

        function selectSkinCategory(categoryId) {
            activeCategoryId = categoryId;
            renderSkins();
        }

        function setActiveSkinCategory(categoryId) {
            tagCategories.activeSkinCategory = categoryId;
            renderSkins();
            saveSkins();
        }

        function renderCategory(category, tags) {
            return `
                <section class="skin-category">
                    <h3>${escapeHtml(categoryLabel(category))}</h3>
                    ${tags.map(tag => renderSkinRow(category.id, tag)).join('')}
                </section>
            `;
        }

        function renderSkinRow(categoryId, tag) {
            const skin = skinForTag(categoryId, tag);
            const key = rowKey(categoryId, tag);
            return `
                <div class="skin-row" data-skin-row="${escapeHtml(key)}">
                    <div class="skin-tag-name">${escapeHtml(tag)}</div>
                    ${renderColorField(key, 'bg', t('label.skinBackground'), skin.bg)}
                    ${renderColorField(key, 'border', t('label.skinBorder'), skin.border)}
                    ${renderColorField(key, 'accent', t('label.skinAccent'), skin.accent)}
                    <div class="skin-preview" data-skin-preview="${escapeHtml(key)}">${escapeHtml(tag)}</div>
                </div>
            `;
        }

        function renderColorField(key, field, label, value) {
            const pickerValue = normalizeHex(value) || defaultColorForField(field);
            return `
                <div class="skin-field">
                    <label>${escapeHtml(label)}</label>
                    <div class="skin-color-input">
                        <input class="skin-color-picker" type="color" data-skin-key="${escapeHtml(key)}" data-skin-picker="${field}" value="${escapeHtml(pickerValue)}" oninput="syncColorText(this)">
                        <input type="text" data-skin-key="${escapeHtml(key)}" data-skin-field="${field}" value="${escapeHtml(value)}" placeholder="#ffffff" oninput="syncColorPicker(this); refreshPreviews()">
                    </div>
                </div>
            `;
        }

        function syncColorText(picker) {
            const input = document.querySelector(`[data-skin-key="${cssEscape(picker.dataset.skinKey)}"][data-skin-field="${picker.dataset.skinPicker}"]`);
            if (input) input.value = picker.value;
            refreshPreviews();
        }

        function syncColorPicker(input) {
            const color = normalizeHex(input.value);
            if (!color) return;
            const picker = document.querySelector(`[data-skin-key="${cssEscape(input.dataset.skinKey)}"][data-skin-picker="${input.dataset.skinField}"]`);
            if (picker) picker.value = color;
        }

        function defaultColorForField(field) {
            if (field === 'bg') return '#ffffff';
            if (field === 'border') return '#d9e1e7';
            return '#111111';
        }

        function refreshPreviews() {
            document.querySelectorAll('[data-skin-preview]').forEach(preview => {
                const key = preview.dataset.skinPreview;
                const skin = collectSkinForKey(key) || { bg: '#ffffff', border: '#d9e1e7', accent: '#111111' };
                preview.style.setProperty('--skin-bg', skin.bg);
                preview.style.setProperty('--skin-border', skin.border);
                preview.style.setProperty('--skin-accent', skin.accent);
                preview.style.opacity = collectSkinForKey(key) ? '1' : '0.58';
            });
        }

        function collectSkinForKey(key) {
            const result = { bg: '', border: '', accent: '' };
            document.querySelectorAll(`[data-skin-key="${cssEscape(key)}"]`).forEach(input => {
                if (input.dataset.skinField) result[input.dataset.skinField] = normalizeHex(input.value);
            });
            return result.bg && result.border && result.accent ? result : null;
        }

        function saveSkins() {
            if (!canManageUsers) return;
            const skins = JSON.parse(JSON.stringify(tagCategories.skins || {}));
            if (activeCategoryId) delete skins[activeCategoryId];
            document.querySelectorAll('[data-skin-row]').forEach(row => {
                const parsed = parseRowKey(row.dataset.skinRow);
                if (!parsed) return;
                const skin = collectSkinForKey(row.dataset.skinRow);
                if (!skin) return;
                skins[parsed.categoryId] = skins[parsed.categoryId] || {};
                skins[parsed.categoryId][parsed.tag] = skin;
            });
            Object.keys(skins).forEach(categoryId => {
                if (!skins[categoryId] || !Object.keys(skins[categoryId]).length) delete skins[categoryId];
            });
            tagCategories.skins = skins;
            tagCategories.activeSkinCategory = tagCategories.activeSkinCategory || activeCategoryId || 'other';
            portalFetch('update_tag_categories.jsp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(tagCategories, null, 2)
            })
                .then(res => res.ok ? res.text() : Promise.reject(new Error('tag_categories.json save failed')))
                .then(() => {
                    showToast(t('toast.saved'));
                    loadSkins();
                })
                .catch(err => alert(t('error.save') + err.message));
        }

        function normalizeTagCategories(config) {
            const source = config && typeof config === 'object' ? config : {};
            const categories = [];
            const seen = new Set();
            (Array.isArray(source.categories) ? source.categories : []).forEach(category => {
                if (!category || typeof category !== 'object') return;
                const id = normalizeCategoryId(category.id);
                if (!id || id === 'other' || seen.has(id)) return;
                categories.push({ id, label: String(category.label || id).trim() || id, protected: false });
                seen.add(id);
            });
            categories.push({ id: 'other', label: '其他', protected: true });
            const validIds = new Set(categories.map(category => category.id));
            const assignments = {};
            const rawAssignments = source.assignments && typeof source.assignments === 'object' ? source.assignments : {};
            Object.keys(rawAssignments).forEach(tag => {
                const tagName = String(tag || '').trim();
                if (!tagName) return;
                const id = normalizeCategoryId(rawAssignments[tag]);
                assignments[tagName] = validIds.has(id) ? id : 'other';
            });
            const skins = {};
            const rawSkins = source.skins && typeof source.skins === 'object' ? source.skins : {};
            Object.keys(rawSkins).forEach(categoryId => {
                const id = normalizeCategoryId(categoryId);
                if (!validIds.has(id) || !rawSkins[categoryId] || typeof rawSkins[categoryId] !== 'object') return;
                skins[id] = {};
                Object.keys(rawSkins[categoryId]).forEach(tag => {
                    const tagName = String(tag || '').trim();
                    const skin = normalizeSkin(rawSkins[categoryId][tag]);
                    if (tagName && skin) skins[id][tagName] = skin;
                });
            });
            const activeSkinCategory = validIds.has(normalizeCategoryId(source.activeSkinCategory))
                ? normalizeCategoryId(source.activeSkinCategory)
                : 'other';
            return { categories, assignments, skins, activeSkinCategory };
        }

        function skinForTag(categoryId, tag) {
            const configured = tagCategories.skins && tagCategories.skins[categoryId] && tagCategories.skins[categoryId][tag];
            return configured || DEFAULT_SKINS[tag] || { bg: '', border: '', accent: '' };
        }

        function normalizeSkin(value) {
            if (!value || typeof value !== 'object') return null;
            const bg = normalizeHex(value.bg);
            const border = normalizeHex(value.border);
            const accent = normalizeHex(value.accent);
            return bg && border && accent ? { bg, border, accent } : null;
        }

        function normalizeHex(value) {
            const text = String(value || '').trim();
            return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toLowerCase() : '';
        }

        function categoryIdForTag(tag) {
            return tagCategories.assignments[String(tag || '').trim()] || 'other';
        }

        function categoryLabel(category) {
            if (category.id === 'other') return t('tagGroup.other');
            return category.label || category.id;
        }

        function normalizeCategoryId(value) {
            return String(value || '').trim().replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase();
        }

        function rowKey(categoryId, tag) {
            return `${categoryId}::${tag}`;
        }

        function parseRowKey(value) {
            const index = String(value || '').indexOf('::');
            if (index <= 0) return null;
            return { categoryId: value.slice(0, index), tag: value.slice(index + 2) };
        }

        function escapeJs(value) {
            return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function uniqueTags(values) {
            const seen = new Set();
            return values.map(value => String(value || '').trim()).filter(value => {
                if (!value || seen.has(value)) return false;
                seen.add(value);
                return true;
            }).sort();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function cssEscape(value) {
            return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/["\\]/g, '\\$&');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
