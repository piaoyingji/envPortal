<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvPortal - 代理ログイン</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js?v=2.6.6"></script>
    <style>
        .proxy-admin-container {
            width: calc(100% - 2rem);
            max-width: 960px;
            margin: 0 auto;
            padding: 0 0 2rem;
        }
        .proxy-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.85rem;
        }
        .proxy-toolbar h2 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--text-main);
        }
        .proxy-help {
            margin: 0 0 0.85rem;
            color: var(--text-muted);
            font-size: 0.84rem;
        }
        .proxy-panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow-card);
            padding: 1rem;
        }
        .proxy-current {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border: 1px solid #fed7aa;
            border-radius: 6px;
            background: #fff7ed;
            color: #9a3412;
            padding: 0.75rem 0.85rem;
            margin-bottom: 1rem;
            font-size: 0.88rem;
            font-weight: 700;
        }
        .proxy-role-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.75rem;
        }
        .proxy-role-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            padding: 0.85rem;
            text-align: left;
        }
        .proxy-role-card.active {
            border-color: #fed7aa;
            background: #fff7ed;
        }
        .proxy-role-title {
            color: var(--text-main);
            font-weight: 750;
            margin-bottom: 0.25rem;
        }
        .proxy-role-key {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }
        .page-message {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body data-title-key="nav.proxyLogin">
    <header class="top-header">
        <div class="logo-area">
            <h1>Env<span>Portal</span></h1>
            <p data-i18n="proxyAdmin.description">指定ロールで画面権限を確認します</p>
        </div>
        <nav class="main-nav">
            <div class="main-nav-inner">
                <a href="index.html" data-i18n="nav.search">環境検索</a>
                <a href="index.html?mode=production" data-i18n="nav.production">本番環境</a>
            </div>
        </nav>
    </header>

    <main class="proxy-admin-container">
        <div class="proxy-toolbar">
            <h2 data-i18n="nav.proxyLogin">代理ログイン</h2>
            <button type="button" class="secondary-btn" onclick="exitProxyAndReturn()" data-i18n="button.proxyLogout">代理ログアウト</button>
        </div>
        <p class="proxy-help" data-i18n="proxyAdmin.help">現在のブラウザーセッションだけでロールを代理します。ユーザー設定は変更されません。</p>
        <div id="proxyArea" class="page-message" data-i18n="state.loading">読み込み中...</div>
    </main>

    <div id="toast" data-i18n="toast.saved">保存成功。</div>

    <script>
        let roles = [];
        let currentProfile = null;

        window.addEventListener('DOMContentLoaded', loadProxyRoles);
        window.addEventListener('i18n:changed', renderProxyRoles);

        function loadProxyRoles() {
            portalFetch('roles_data.jsp?t=' + new Date().getTime(), { cache: 'no-store', skipProxyRole: true })
                .then(res => res.ok ? res.json() : Promise.reject(new Error('Forbidden')))
                .then(payload => {
                    currentProfile = payload;
                    roles = normalizeRoles(payload.roles || []);
                    setCurrentUser(payload);
                    setSystemMenuVisible(isSystemAdmin(payload));
                    renderProxyRoles();
                    refreshProxyStatus();
                })
                .catch(() => {
                    setCurrentUser(null);
                    setSystemMenuVisible(false);
                    document.getElementById('proxyArea').innerHTML = t('proxyAdmin.noPermission');
                });
        }

        function refreshProxyStatus() {
            if (!readPortalProxyRole()) return;
            portalFetch('auth_windows.jsp?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(res => res.ok ? res.json() : null)
                .then(profile => {
                    if (profile) setCurrentUser(profile);
                })
                .catch(() => {});
        }

        function renderProxyRoles() {
            const area = document.getElementById('proxyArea');
            if (!roles.length) {
                area.className = 'page-message';
                area.innerHTML = t('roleAdmin.noRoles');
                return;
            }
            const activeRole = readPortalProxyRole();
            const active = roles.find(role => role.key === activeRole);
            area.className = 'proxy-panel';
            area.innerHTML = `
                ${active ? `
                    <div class="proxy-current">
                        <span>${escapeHtml(t('proxyAdmin.current', { role: active.label || active.key }))}</span>
                        <button type="button" class="secondary-btn" onclick="exitProxyAndReturn()">${t('button.proxyLogout')}</button>
                    </div>
                ` : ''}
                <h3>${escapeHtml(t('proxyAdmin.selectRole'))}</h3>
                <div class="proxy-role-list">
                    ${roles.map(role => renderRoleCard(role, activeRole)).join('')}
                </div>
            `;
        }

        function renderRoleCard(role, activeRole) {
            const activeClass = role.key === activeRole ? ' active' : '';
            return `
                <div class="proxy-role-card${activeClass}">
                    <div class="proxy-role-title">${escapeHtml(role.label || role.key)}</div>
                    <div class="proxy-role-key">${escapeHtml(role.key)}</div>
                    <button type="button" class="primary-btn" onclick="startProxyLogin('${escapeJs(role.key)}')">${t('button.proxyLogin')}</button>
                </div>
            `;
        }

        function startProxyLogin(roleKey) {
            setPortalProxyRole(roleKey);
            location.href = 'index.html';
        }

        function exitProxyAndReturn() {
            clearPortalProxyRole();
            location.href = 'index.html';
        }

        function normalizeRoles(values) {
            return values.map(role => ({
                key: String(role.key || '').trim(),
                label: String(role.label || role.key || '').trim()
            })).filter(role => role.key);
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function escapeJs(value) {
            return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '\\r');
        }
    </script>
</body>
</html>
